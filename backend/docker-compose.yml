services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dcm_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dcm_net

  migrate:
    image: migrate/migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://postgres:postgres@db:5432/dcm_db?sslmode=disable", "up"]
    networks:
      - dcm_net

  traefik:
    image: traefik:v3.6
    container_name: dcm_traefik
    user: root
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy_net
      - dcm_net

  registry:
    image: registry:2
    container_name: registry
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true" # ОЧЕНЬ ВАЖНО! Иначе API DELETE не будет работать
    ports:
      - "5000:5000"
    volumes:
      - ./registry_data:/var/lib/registry
    networks:
      - dcm_net

networks:
  proxy_net:
    external: true
  dcm_net:
    name: dcm_net