services:
  core_db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${CORE_POSTGRES_DB:-dcm_core_db}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dcm_net

  sso_db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${SSO_POSTGRES_DB:-dcm_sso_db}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dcm_net

  migrate_core:
    image: migrate/migrate
    depends_on:
      core_db:
        condition: service_healthy
    volumes:
      - ./migrations/core:/migrations
    command: ["-path", "/migrations", "-database", "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@core_db:5432/${CORE_POSTGRES_DB:-dcm_core_db}?sslmode=disable", "up"]
    networks:
      - dcm_net

  migrate_sso:
    image: migrate/migrate
    depends_on:
      sso_db:
        condition: service_healthy
    volumes:
      - ./migrations/sso:/migrations
    command: ["-path", "/migrations", "-database", "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@sso_db:5432/${SSO_POSTGRES_DB:-dcm_sso_db}?sslmode=disable", "up"]
    networks:
      - dcm_net

  clickhouse:
    image: clickhouse/clickhouse-server:25.5
    environment:
      CLICKHOUSE_DB: "${CLICKHOUSE_DB:-dcm_reports}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-dcm_reports}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --host localhost --user $${CLICKHOUSE_USER} --password $${CLICKHOUSE_PASSWORD} --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dcm_net

  migrate_reports:
    image: migrate/migrate
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./migrations/reports:/migrations
    command: ["-path", "/migrations", "-database", "clickhouse://clickhouse:9000?username=${CLICKHOUSE_USER:-dcm_reports}&password=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}&database=${CLICKHOUSE_DB:-dcm_reports}&x-migrations-table-engine=MergeTree", "up"]
    networks:
      - dcm_net

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-dcm}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dcm_net

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-dcm_minio}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dcm_net

  traefik:
    image: traefik:v3.6
    container_name: dcm_traefik
    user: root
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy_net"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy_net
      - dcm_net

  registry:
    image: registry:2
    container_name: registry
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./registry_data:/var/lib/registry
    networks:
      - dcm_net
      - build_net

  sso:
    build:
      context: .
      dockerfile: dockerfiles/sso.Dockerfile
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@sso_db:5432/${SSO_POSTGRES_DB:-dcm_sso_db}?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}"
      SSO_ADMIN_USERNAME: "${SSO_ADMIN_USERNAME:-admin}"
      SSO_ADMIN_EMAIL: "${SSO_ADMIN_EMAIL:-admin@example.local}"
      SSO_ADMIN_PASSWORD: "${SSO_ADMIN_PASSWORD:?SSO_ADMIN_PASSWORD is required}"
      SSO_LOCAL_LOGIN_ENABLED: "${SSO_LOCAL_LOGIN_ENABLED:-true}"
      SSO_LOCAL_REGISTER_ENABLED: "${SSO_LOCAL_REGISTER_ENABLED:-true}"
      SSO_OIDC_ENABLED: "${SSO_OIDC_ENABLED:-false}"
      SSO_OIDC_ISSUER_URL: "${SSO_OIDC_ISSUER_URL:-}"
      SSO_OIDC_CLIENT_ID: "${SSO_OIDC_CLIENT_ID:-}"
      SSO_OIDC_CLIENT_SECRET: "${SSO_OIDC_CLIENT_SECRET:-}"
      SSO_OIDC_REDIRECT_URL: "${SSO_OIDC_REDIRECT_URL:-}"
      SSO_OIDC_ADMIN_GROUPS: "${SSO_OIDC_ADMIN_GROUPS:-}"
      SSO_OIDC_DEFAULT_ROLE: "${SSO_OIDC_DEFAULT_ROLE:-user}"
      SSO_GRPC_PORT: "50051"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "keycloak.localhost:host-gateway"
    networks:
      - dcm_net
    depends_on:
      migrate_sso:
        condition: service_completed_successfully

  core:
    build:
      context: .
      dockerfile: dockerfiles/core.Dockerfile
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@core_db:5432/${CORE_POSTGRES_DB:-dcm_core_db}?sslmode=disable"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}"
      SSO_GRPC_TARGET: "sso:50051"
      BASE_DOMAIN: "localhost"
      IMAGE_BUILDS_ENABLED: "${IMAGE_BUILDS_ENABLED:-true}"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-dcm}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/"
      OBJECT_STORAGE_ENDPOINT: "minio:9000"
      OBJECT_STORAGE_BUCKET: "${OBJECT_STORAGE_BUCKET:-dcm-builds}"
      OBJECT_STORAGE_ACCESS_KEY: "${MINIO_ROOT_USER:-dcm_minio}"
      OBJECT_STORAGE_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
      OBJECT_STORAGE_USE_SSL: "false"
      CLICKHOUSE_ADDR: "clickhouse:9000"
      CLICKHOUSE_DB: "${CLICKHOUSE_DB:-dcm_reports}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-dcm_reports}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}"
      REGISTRY_API_URL: "registry:5000"
      REGISTRY_PUBLIC_URL: "localhost:5000"
      REGISTRY_CONTAINER_NAME: "registry"
      CONTAINER_PIDS_LIMIT: 256
      CONTAINER_MEMORY_SWAP_MULTIPLIER: 2
      PROXY_NETWORK_NAME: "proxy_net"
      BUILD_NETWORK_NAME: "build_net"
      BUILD_MEMORY_BYTES: 2147483648
      BUILD_CPU_QUOTA: 200000
      BUILD_CPU_PERIOD: 100000
      BUILD_MEMORY_SWAP_MULTIPLIER: 2
      BUILD_PIDS_LIMIT: 512
      KANIKO_IMAGE: "gcr.io/kaniko-project/executor:latest"
      MAX_BUILD_TIME_MINUTES: 10
      MAX_CONCURRENT_BUILDS: 2
      MAX_UPLOAD_SIZE_BYTES: 52428800
      MAX_ARCHIVE_SIZE_BYTES: 52428800
      MAX_UNPACKED_SIZE_BYTES: 524288000
      MAX_BUILD_LOG_SIZE_BYTES: 5242880
      BUILD_CANCEL_POLL_INTERVAL_SECONDS: 2
      TTL_WORKER_INTERVAL_SECONDS: 60
      GC_WORKER_INTERVAL_MINUTES: 60
      STALE_BUILD_TIMEOUT_MINUTES: 30
      EVENT_SYNC_INTERVAL_SECONDS: 30
      EVENT_RECONNECT_DELAY_SECONDS: 5
      BUILD_OUTBOX_INTERVAL_SECONDS: 1
      BUILD_OUTBOX_BATCH_SIZE: 10
      MAX_STAGED_SOURCE_BYTES_PER_USER: 1073741824
      MAX_QUEUED_BUILDS_PER_USER: 10
      COMPOSE_UPLOAD_MAX_BYTES: 104857600
      COMPOSE_PIPELINE_TIMEOUT_MINUTES: 30
      COMPOSE_DEPLOY_WORKER_COUNT: 2
      COMPOSE_OUTBOX_INTERVAL_SECONDS: 1
      COMPOSE_OUTBOX_BATCH_SIZE: 10
      COMPOSE_DEPLOY_MAX_ATTEMPTS: 3
      MAX_QUEUED_COMPOSE_DEPLOYS_PER_USER: 5
      COMPOSE_BUILD_POLL_INTERVAL_SECONDS: 3
      COMPOSE_DEPENDENCY_WAIT_TIMEOUT_MINUTES: 5
      COMPOSE_DEPENDENCY_POLL_INTERVAL_SECONDS: 2
      HOST_MIN_FREE_DISK_BYTES: 1073741824
      GIT_SOURCES_ENABLED: "${GIT_SOURCES_ENABLED:-true}"
      GIT_ALLOWED_HOSTS: "${GIT_ALLOWED_HOSTS:-github.com,gitlab.com,bitbucket.org}"
      GIT_CLONE_TIMEOUT_SECONDS: "${GIT_CLONE_TIMEOUT_SECONDS:-60}"
      GIT_MAX_REPOSITORY_BYTES: "${GIT_MAX_REPOSITORY_BYTES:-209715200}"
      TELEMETRY_MAX_LOG_TAIL_LINES: 1000
      TELEMETRY_MAX_LOG_STREAMS_PER_USER: 5
      TELEMETRY_MAX_TERMINAL_SESSIONS_PER_USER: 2
      TELEMETRY_TERMINAL_IDLE_TIMEOUT_SECONDS: 300
      TELEMETRY_TERMINAL_MAX_DURATION_SECONDS: 3600
      TELEMETRY_ALLOWED_EXEC_COMMANDS: "/bin/sh,/bin/bash,/busybox/sh"
      TELEMETRY_MAX_COMMAND_ARGS: 8
      TELEMETRY_MAX_COMMAND_ARG_BYTES: 128
      TELEMETRY_WS_READ_LIMIT_BYTES: 4096
      CORE_GRPC_PORT: "50052"
      CORE_HTTP_PORT: "8083"
      CORE_HOST_DISK_PATH: "${CORE_HOST_DISK_PATH:-/host}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:ro
      - ./config:/app/config
    networks:
      - dcm_net
    depends_on:
      migrate_core:
        condition: service_completed_successfully
      migrate_reports:
        condition: service_completed_successfully
      sso:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  builder:
    build:
      context: .
      dockerfile: dockerfiles/builder.Dockerfile
    environment:
      CORE_GRPC_TARGET: "core:50052"
      BUILDER_INSTANCE_ID: "${BUILDER_INSTANCE_ID:-}"
      REGISTRY_URL: "registry:5000"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-dcm}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/"
      OBJECT_STORAGE_ENDPOINT: "minio:9000"
      OBJECT_STORAGE_BUCKET: "${OBJECT_STORAGE_BUCKET:-dcm-builds}"
      OBJECT_STORAGE_ACCESS_KEY: "${MINIO_ROOT_USER:-dcm_minio}"
      OBJECT_STORAGE_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
      OBJECT_STORAGE_USE_SSL: "false"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}"
      BUILD_NETWORK_NAME: "build_net"
      BUILD_STORAGE_PATH: "/tmp/builds"
      BUILD_LOGS_PATH: "/tmp/build_logs"
      BUILD_MEMORY_BYTES: 2147483648
      BUILD_CPU_QUOTA: 200000
      BUILD_CPU_PERIOD: 100000
      BUILD_MEMORY_SWAP_MULTIPLIER: 2
      BUILD_PIDS_LIMIT: 512
      KANIKO_IMAGE: "gcr.io/kaniko-project/executor:latest"
      MAX_BUILD_TIME_MINUTES: 10
      MAX_CONCURRENT_BUILDS: 2
      MAX_UPLOAD_SIZE_BYTES: 52428800
      MAX_ARCHIVE_SIZE_BYTES: 52428800
      MAX_UNPACKED_SIZE_BYTES: 524288000
      MAX_BUILD_LOG_SIZE_BYTES: 5242880
      BUILD_CANCEL_POLL_INTERVAL_SECONDS: 2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - builder_storage:/tmp/builds
      - builder_logs:/tmp/build_logs
    networks:
      - dcm_net
    depends_on:
      core:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  telemetry:
    build:
      context: .
      dockerfile: dockerfiles/telemetry.Dockerfile
    environment:
      TELEMETRY_PORT: "8084"
      CORE_GRPC_TARGET: "core:50052"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}"
      TELEMETRY_MAX_GLOBAL_LOG_STREAMS: "${TELEMETRY_MAX_GLOBAL_LOG_STREAMS:-100}"
      TELEMETRY_MAX_GLOBAL_TERMINAL_SESSIONS: "${TELEMETRY_MAX_GLOBAL_TERMINAL_SESSIONS:-50}"
      TELEMETRY_READ_HEADER_TIMEOUT_SECONDS: "${TELEMETRY_READ_HEADER_TIMEOUT_SECONDS:-5}"
      TELEMETRY_IDLE_TIMEOUT_SECONDS: "${TELEMETRY_IDLE_TIMEOUT_SECONDS:-120}"
      TELEMETRY_SHUTDOWN_TIMEOUT_SECONDS: "${TELEMETRY_SHUTDOWN_TIMEOUT_SECONDS:-15}"
      TELEMETRY_MAX_HEADER_BYTES: "${TELEMETRY_MAX_HEADER_BYTES:-1048576}"
      TELEMETRY_GRPC_REQUEST_TIMEOUT_SECONDS: "${TELEMETRY_GRPC_REQUEST_TIMEOUT_SECONDS:-10}"
      TELEMETRY_GRPC_MIN_CONNECT_TIMEOUT_SECONDS: "${TELEMETRY_GRPC_MIN_CONNECT_TIMEOUT_SECONDS:-5}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - dcm_net
    depends_on:
      core:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: dockerfiles/gateway.Dockerfile
    environment:
      GATEWAY_PORT: "8081"
      SSO_GRPC_TARGET: "sso:50051"
      CORE_GRPC_TARGET: "core:50052"
      CORE_HTTP_TARGET: "http://core:8083"
      TELEMETRY_HTTP_TARGET: "http://telemetry:8084"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:5173}"
      GATEWAY_TRUSTED_PROXIES: "${GATEWAY_TRUSTED_PROXIES:-}"
      GATEWAY_MAX_JSON_BODY_BYTES: "${GATEWAY_MAX_JSON_BODY_BYTES:-1048576}"
      GATEWAY_AUTH_RATE_LIMIT_REQUESTS: "${GATEWAY_AUTH_RATE_LIMIT_REQUESTS:-20}"
      GATEWAY_AUTH_RATE_LIMIT_WINDOW_SECONDS: "${GATEWAY_AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}"
      GATEWAY_AUTH_REDIRECT_ALLOWED_ORIGINS: "${GATEWAY_AUTH_REDIRECT_ALLOWED_ORIGINS:-}"
      GATEWAY_AUTH_CALLBACK_PATH: "${GATEWAY_AUTH_CALLBACK_PATH:-/auth/callback}"
      GATEWAY_UPLOAD_RATE_LIMIT_REQUESTS: "${GATEWAY_UPLOAD_RATE_LIMIT_REQUESTS:-10}"
      GATEWAY_UPLOAD_RATE_LIMIT_WINDOW_SECONDS: "${GATEWAY_UPLOAD_RATE_LIMIT_WINDOW_SECONDS:-60}"
      GATEWAY_READ_HEADER_TIMEOUT_SECONDS: "${GATEWAY_READ_HEADER_TIMEOUT_SECONDS:-5}"
      GATEWAY_READ_TIMEOUT_SECONDS: "${GATEWAY_READ_TIMEOUT_SECONDS:-300}"
      GATEWAY_WRITE_TIMEOUT_SECONDS: "${GATEWAY_WRITE_TIMEOUT_SECONDS:-300}"
      GATEWAY_IDLE_TIMEOUT_SECONDS: "${GATEWAY_IDLE_TIMEOUT_SECONDS:-120}"
      GATEWAY_SHUTDOWN_TIMEOUT_SECONDS: "${GATEWAY_SHUTDOWN_TIMEOUT_SECONDS:-15}"
      GATEWAY_MAX_HEADER_BYTES: "${GATEWAY_MAX_HEADER_BYTES:-1048576}"
      GATEWAY_PROXY_DIAL_TIMEOUT_SECONDS: "${GATEWAY_PROXY_DIAL_TIMEOUT_SECONDS:-10}"
      GATEWAY_PROXY_TLS_HANDSHAKE_TIMEOUT_SECONDS: "${GATEWAY_PROXY_TLS_HANDSHAKE_TIMEOUT_SECONDS:-10}"
      GATEWAY_PROXY_RESPONSE_HEADER_TIMEOUT_SECONDS: "${GATEWAY_PROXY_RESPONSE_HEADER_TIMEOUT_SECONDS:-60}"
      GATEWAY_PROXY_IDLE_CONN_TIMEOUT_SECONDS: "${GATEWAY_PROXY_IDLE_CONN_TIMEOUT_SECONDS:-90}"
      GATEWAY_PROXY_EXPECT_CONTINUE_TIMEOUT_SECONDS: "${GATEWAY_PROXY_EXPECT_CONTINUE_TIMEOUT_SECONDS:-1}"
      GATEWAY_PROXY_MAX_IDLE_CONNS: "${GATEWAY_PROXY_MAX_IDLE_CONNS:-100}"
      GATEWAY_PROXY_MAX_IDLE_CONNS_PER_HOST: "${GATEWAY_PROXY_MAX_IDLE_CONNS_PER_HOST:-20}"
      GATEWAY_GRPC_REQUEST_TIMEOUT_SECONDS: "${GATEWAY_GRPC_REQUEST_TIMEOUT_SECONDS:-10}"
      GATEWAY_GRPC_MIN_CONNECT_TIMEOUT_SECONDS: "${GATEWAY_GRPC_MIN_CONNECT_TIMEOUT_SECONDS:-5}"
      GATEWAY_GRPC_TLS_ENABLED: "${GATEWAY_GRPC_TLS_ENABLED:-false}"
      GATEWAY_GRPC_TLS_CA_FILE: "${GATEWAY_GRPC_TLS_CA_FILE:-}"
      GATEWAY_GRPC_TLS_CERT_FILE: "${GATEWAY_GRPC_TLS_CERT_FILE:-}"
      GATEWAY_GRPC_TLS_KEY_FILE: "${GATEWAY_GRPC_TLS_KEY_FILE:-}"
      GATEWAY_GRPC_TLS_SERVER_NAME: "${GATEWAY_GRPC_TLS_SERVER_NAME:-}"
      GATEWAY_READINESS_TIMEOUT_SECONDS: "${GATEWAY_READINESS_TIMEOUT_SECONDS:-3}"
      GATEWAY_TELEMETRY_TICKET_TTL_SECONDS: "${GATEWAY_TELEMETRY_TICKET_TTL_SECONDS:-60}"
      COOKIE_NAME: "${COOKIE_NAME:-refresh_token}"
      COOKIE_PATH: "${COOKIE_PATH:-/}"
      COOKIE_DOMAIN: "${COOKIE_DOMAIN:-}"
      COOKIE_MAX_AGE_SECONDS: "${COOKIE_MAX_AGE_SECONDS:-2592000}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      COOKIE_HTTP_ONLY: "${COOKIE_HTTP_ONLY:-true}"
      COOKIE_SAMESITE: "${COOKIE_SAMESITE:-lax}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway-api.rule=Host(`localhost`) && PathPrefix(`/api/v1`)"
      - "traefik.http.routers.gateway-api.priority=10"
      - "traefik.http.routers.gateway-api.service=gateway"
      - "traefik.http.routers.gateway-api.middlewares=dcm-security-headers,dcm-api-ratelimit,dcm-json-buffer"
      - "traefik.http.routers.gateway-upload.rule=Host(`localhost`) && (Path(`/api/v1/images/build`) || Path(`/api/v1/images/build/git`) || Path(`/api/v1/projects/compose`) || Path(`/api/v1/projects/compose/git`))"
      - "traefik.http.routers.gateway-upload.priority=30"
      - "traefik.http.routers.gateway-upload.service=gateway"
      - "traefik.http.routers.gateway-upload.middlewares=dcm-security-headers,dcm-api-ratelimit"
      - "traefik.http.routers.gateway-stream.rule=Host(`localhost`) && PathRegexp(`^/api/v1/(admin/)?containers/[^/]+/(logs/stream|terminal)$`)"
      - "traefik.http.routers.gateway-stream.priority=40"
      - "traefik.http.routers.gateway-stream.service=gateway"
      - "traefik.http.routers.gateway-stream.middlewares=dcm-security-headers"
      - "traefik.http.routers.gateway-health.rule=Host(`localhost`) && PathPrefix(`/health`)"
      - "traefik.http.routers.gateway-health.priority=10"
      - "traefik.http.routers.gateway-health.service=gateway"
      - "traefik.http.routers.gateway-health.middlewares=dcm-security-headers"
      - "traefik.http.services.gateway.loadbalancer.server.port=8081"
      - "traefik.http.middlewares.dcm-security-headers.headers.contenttypenosniff=true"
      - "traefik.http.middlewares.dcm-security-headers.headers.framedeny=true"
      - "traefik.http.middlewares.dcm-security-headers.headers.referrerpolicy=same-origin"
      - "traefik.http.middlewares.dcm-api-ratelimit.ratelimit.average=120"
      - "traefik.http.middlewares.dcm-api-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.dcm-api-ratelimit.ratelimit.burst=60"
      - "traefik.http.middlewares.dcm-json-buffer.buffering.maxrequestbodybytes=1048576"
      - "traefik.http.middlewares.dcm-json-buffer.buffering.memrequestbodybytes=1048576"
      - "traefik.docker.network=proxy_net"
    networks:
      - proxy_net
      - dcm_net
    depends_on:
      - sso
      - core
      - telemetry

networks:
  proxy_net:
    external: true
  dcm_net:
    name: dcm_net
  build_net:
    name: build_net

volumes:
  builder_storage:
  builder_logs:
  rabbitmq_data:
  minio_data:
  clickhouse_data:
