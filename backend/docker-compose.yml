services:
  core_db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${CORE_POSTGRES_DB:-dcm_core_db}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dcm_net

  sso_db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${SSO_POSTGRES_DB:-dcm_sso_db}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dcm_net

  migrate_core:
    image: migrate/migrate
    depends_on:
      core_db:
        condition: service_healthy
    volumes:
      - ./migrations/core:/migrations
    command: ["-path", "/migrations", "-database", "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@core_db:5432/${CORE_POSTGRES_DB:-dcm_core_db}?sslmode=disable", "up"]
    networks:
      - dcm_net

  migrate_sso:
    image: migrate/migrate
    depends_on:
      sso_db:
        condition: service_healthy
    volumes:
      - ./migrations/sso:/migrations
    command: ["-path", "/migrations", "-database", "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@sso_db:5432/${SSO_POSTGRES_DB:-dcm_sso_db}?sslmode=disable", "up"]
    networks:
      - dcm_net

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-dcm}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dcm_net

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-dcm_minio}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dcm_net

  traefik:
    image: traefik:v3.6
    container_name: dcm_traefik
    user: root
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy_net
      - dcm_net

  registry:
    image: registry:2
    container_name: registry
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./registry_data:/var/lib/registry
    networks:
      - dcm_net
      - build_net

  sso:
    build:
      context: .
      dockerfile: dockerfiles/sso.Dockerfile
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@sso_db:5432/${SSO_POSTGRES_DB:-dcm_sso_db}?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}"
      SSO_GRPC_PORT: "50051"
    networks:
      - dcm_net
    depends_on:
      migrate_sso:
        condition: service_completed_successfully

  core:
    build:
      context: .
      dockerfile: dockerfiles/core.Dockerfile
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@core_db:5432/${CORE_POSTGRES_DB:-dcm_core_db}?sslmode=disable"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}"
      SSO_GRPC_TARGET: "sso:50051"
      BASE_DOMAIN: "localhost"
      BUILDER_HTTP_TARGET: "http://builder:8082"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-dcm}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/"
      REGISTRY_API_URL: "registry:5000"
      REGISTRY_PUBLIC_URL: "localhost:5000"
      REGISTRY_CONTAINER_NAME: "registry"
      CORE_GRPC_PORT: "50052"
      CORE_HTTP_PORT: "8083"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/app/config
    networks:
      - dcm_net
    depends_on:
      migrate_core:
        condition: service_completed_successfully
      sso:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  builder:
    build:
      context: .
      dockerfile: dockerfiles/builder.Dockerfile
    environment:
      BUILDER_PORT: "8082"
      CORE_GRPC_TARGET: "core:50052"
      REGISTRY_URL: "registry:5000"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-dcm}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/"
      OBJECT_STORAGE_ENDPOINT: "minio:9000"
      OBJECT_STORAGE_BUCKET: "${OBJECT_STORAGE_BUCKET:-dcm-builds}"
      OBJECT_STORAGE_ACCESS_KEY: "${MINIO_ROOT_USER:-dcm_minio}"
      OBJECT_STORAGE_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
      OBJECT_STORAGE_USE_SSL: "false"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}"
      BUILD_NETWORK_NAME: "build_net"
      BUILD_STORAGE_PATH: "/tmp/builds"
      BUILD_LOGS_PATH: "/tmp/build_logs"
      BUILD_MEMORY_BYTES: 2147483648
      BUILD_CPU_QUOTA: 200000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - builder_storage:/tmp/builds
      - builder_logs:/tmp/build_logs
    networks:
      - dcm_net
    depends_on:
      core:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: dockerfiles/gateway.Dockerfile
    environment:
      GATEWAY_PORT: "8081"
      SSO_GRPC_TARGET: "sso:50051"
      CORE_GRPC_TARGET: "core:50052"
      BUILDER_HTTP_TARGET: "http://builder:8082"
      CORE_HTTP_TARGET: "http://core:8083"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:5173}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=Host(`localhost`) && PathPrefix(`/api/v1`)"
      - "traefik.http.services.gateway.loadbalancer.server.port=8081"
      - "traefik.docker.network=proxy_net"
    networks:
      - proxy_net
      - dcm_net
    depends_on:
      - sso
      - core
      - builder

networks:
  proxy_net:
    external: true
  dcm_net:
    name: dcm_net
  build_net:
    name: build_net

volumes:
  builder_storage:
  builder_logs:
  rabbitmq_data:
  minio_data:
