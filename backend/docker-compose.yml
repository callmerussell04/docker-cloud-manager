services:
  core_db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${CORE_POSTGRES_DB:-dcm_core_db}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dcm_net

  sso_db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${SSO_POSTGRES_DB:-dcm_sso_db}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dcm_net

  migrate_core:
    image: migrate/migrate
    depends_on:
      core_db:
        condition: service_healthy
    volumes:
      - ./migrations/core:/migrations
    command: ["-path", "/migrations", "-database", "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@core_db:5432/${CORE_POSTGRES_DB:-dcm_core_db}?sslmode=disable", "up"]
    networks:
      - dcm_net

  migrate_sso:
    image: migrate/migrate
    depends_on:
      sso_db:
        condition: service_healthy
    volumes:
      - ./migrations/sso:/migrations
    command: ["-path", "/migrations", "-database", "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@sso_db:5432/${SSO_POSTGRES_DB:-dcm_sso_db}?sslmode=disable", "up"]
    networks:
      - dcm_net

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-dcm}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dcm_net

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-dcm_minio}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dcm_net

  traefik:
    image: traefik:v3.6
    container_name: dcm_traefik
    user: root
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy_net
      - dcm_net

  registry:
    image: registry:2
    container_name: registry
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./registry_data:/var/lib/registry
    networks:
      - dcm_net
      - build_net

  sso:
    build:
      context: .
      dockerfile: dockerfiles/sso.Dockerfile
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@sso_db:5432/${SSO_POSTGRES_DB:-dcm_sso_db}?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}"
      SSO_GRPC_PORT: "50051"
    networks:
      - dcm_net
    depends_on:
      migrate_sso:
        condition: service_completed_successfully

  core:
    build:
      context: .
      dockerfile: dockerfiles/core.Dockerfile
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@core_db:5432/${CORE_POSTGRES_DB:-dcm_core_db}?sslmode=disable"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}"
      SSO_GRPC_TARGET: "sso:50051"
      BASE_DOMAIN: "localhost"
      BUILDER_HTTP_TARGET: "http://builder:8082"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-dcm}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/"
      REGISTRY_API_URL: "registry:5000"
      REGISTRY_PUBLIC_URL: "localhost:5000"
      REGISTRY_CONTAINER_NAME: "registry"
      CONTAINER_PIDS_LIMIT: 256
      CONTAINER_MEMORY_SWAP_MULTIPLIER: 2
      PROXY_NETWORK_NAME: "proxy_net"
      BUILD_NETWORK_NAME: "build_net"
      BUILD_MEMORY_BYTES: 2147483648
      BUILD_CPU_QUOTA: 200000
      BUILD_CPU_PERIOD: 100000
      BUILD_MEMORY_SWAP_MULTIPLIER: 2
      BUILD_PIDS_LIMIT: 512
      KANIKO_IMAGE: "gcr.io/kaniko-project/executor:latest"
      MAX_BUILD_TIME_MINUTES: 10
      MAX_CONCURRENT_BUILDS: 2
      MAX_UPLOAD_SIZE_BYTES: 52428800
      MAX_ARCHIVE_SIZE_BYTES: 52428800
      MAX_UNPACKED_SIZE_BYTES: 524288000
      MAX_BUILD_LOG_SIZE_BYTES: 5242880
      TTL_WORKER_INTERVAL_SECONDS: 60
      GC_WORKER_INTERVAL_MINUTES: 60
      STALE_BUILD_TIMEOUT_MINUTES: 30
      EVENT_SYNC_INTERVAL_SECONDS: 30
      EVENT_RECONNECT_DELAY_SECONDS: 5
      BUILD_OUTBOX_INTERVAL_SECONDS: 1
      BUILD_OUTBOX_BATCH_SIZE: 10
      COMPOSE_UPLOAD_MAX_BYTES: 104857600
      COMPOSE_PIPELINE_TIMEOUT_MINUTES: 30
      COMPOSE_BUILDER_HTTP_TIMEOUT_SECONDS: 30
      COMPOSE_BUILD_POLL_INTERVAL_SECONDS: 3
      COMPOSE_DEPENDENCY_WAIT_TIMEOUT_MINUTES: 5
      COMPOSE_DEPENDENCY_POLL_INTERVAL_SECONDS: 2
      CORE_GRPC_PORT: "50052"
      CORE_HTTP_PORT: "8083"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/app/config
    networks:
      - dcm_net
    depends_on:
      migrate_core:
        condition: service_completed_successfully
      sso:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  builder:
    build:
      context: .
      dockerfile: dockerfiles/builder.Dockerfile
    environment:
      BUILDER_PORT: "8082"
      CORE_GRPC_TARGET: "core:50052"
      REGISTRY_URL: "registry:5000"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-dcm}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/"
      OBJECT_STORAGE_ENDPOINT: "minio:9000"
      OBJECT_STORAGE_BUCKET: "${OBJECT_STORAGE_BUCKET:-dcm-builds}"
      OBJECT_STORAGE_ACCESS_KEY: "${MINIO_ROOT_USER:-dcm_minio}"
      OBJECT_STORAGE_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
      OBJECT_STORAGE_USE_SSL: "false"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}"
      BUILD_NETWORK_NAME: "build_net"
      BUILD_STORAGE_PATH: "/tmp/builds"
      BUILD_LOGS_PATH: "/tmp/build_logs"
      BUILD_MEMORY_BYTES: 2147483648
      BUILD_CPU_QUOTA: 200000
      BUILD_CPU_PERIOD: 100000
      BUILD_MEMORY_SWAP_MULTIPLIER: 2
      BUILD_PIDS_LIMIT: 512
      KANIKO_IMAGE: "gcr.io/kaniko-project/executor:latest"
      MAX_BUILD_TIME_MINUTES: 10
      MAX_CONCURRENT_BUILDS: 2
      MAX_UPLOAD_SIZE_BYTES: 52428800
      MAX_ARCHIVE_SIZE_BYTES: 52428800
      MAX_UNPACKED_SIZE_BYTES: 524288000
      MAX_BUILD_LOG_SIZE_BYTES: 5242880
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - builder_storage:/tmp/builds
      - builder_logs:/tmp/build_logs
    networks:
      - dcm_net
    depends_on:
      core:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: dockerfiles/gateway.Dockerfile
    environment:
      GATEWAY_PORT: "8081"
      SSO_GRPC_TARGET: "sso:50051"
      CORE_GRPC_TARGET: "core:50052"
      BUILDER_HTTP_TARGET: "http://builder:8082"
      CORE_HTTP_TARGET: "http://core:8083"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:5173}"
      GATEWAY_TRUSTED_PROXIES: "${GATEWAY_TRUSTED_PROXIES:-}"
      GATEWAY_MAX_JSON_BODY_BYTES: "${GATEWAY_MAX_JSON_BODY_BYTES:-1048576}"
      GATEWAY_AUTH_RATE_LIMIT_REQUESTS: "${GATEWAY_AUTH_RATE_LIMIT_REQUESTS:-20}"
      GATEWAY_AUTH_RATE_LIMIT_WINDOW_SECONDS: "${GATEWAY_AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}"
      GATEWAY_UPLOAD_RATE_LIMIT_REQUESTS: "${GATEWAY_UPLOAD_RATE_LIMIT_REQUESTS:-10}"
      GATEWAY_UPLOAD_RATE_LIMIT_WINDOW_SECONDS: "${GATEWAY_UPLOAD_RATE_LIMIT_WINDOW_SECONDS:-60}"
      GATEWAY_READ_HEADER_TIMEOUT_SECONDS: "${GATEWAY_READ_HEADER_TIMEOUT_SECONDS:-5}"
      GATEWAY_READ_TIMEOUT_SECONDS: "${GATEWAY_READ_TIMEOUT_SECONDS:-300}"
      GATEWAY_WRITE_TIMEOUT_SECONDS: "${GATEWAY_WRITE_TIMEOUT_SECONDS:-300}"
      GATEWAY_IDLE_TIMEOUT_SECONDS: "${GATEWAY_IDLE_TIMEOUT_SECONDS:-120}"
      GATEWAY_SHUTDOWN_TIMEOUT_SECONDS: "${GATEWAY_SHUTDOWN_TIMEOUT_SECONDS:-15}"
      GATEWAY_MAX_HEADER_BYTES: "${GATEWAY_MAX_HEADER_BYTES:-1048576}"
      GATEWAY_PROXY_DIAL_TIMEOUT_SECONDS: "${GATEWAY_PROXY_DIAL_TIMEOUT_SECONDS:-10}"
      GATEWAY_PROXY_TLS_HANDSHAKE_TIMEOUT_SECONDS: "${GATEWAY_PROXY_TLS_HANDSHAKE_TIMEOUT_SECONDS:-10}"
      GATEWAY_PROXY_RESPONSE_HEADER_TIMEOUT_SECONDS: "${GATEWAY_PROXY_RESPONSE_HEADER_TIMEOUT_SECONDS:-60}"
      GATEWAY_PROXY_IDLE_CONN_TIMEOUT_SECONDS: "${GATEWAY_PROXY_IDLE_CONN_TIMEOUT_SECONDS:-90}"
      GATEWAY_PROXY_EXPECT_CONTINUE_TIMEOUT_SECONDS: "${GATEWAY_PROXY_EXPECT_CONTINUE_TIMEOUT_SECONDS:-1}"
      GATEWAY_PROXY_MAX_IDLE_CONNS: "${GATEWAY_PROXY_MAX_IDLE_CONNS:-100}"
      GATEWAY_PROXY_MAX_IDLE_CONNS_PER_HOST: "${GATEWAY_PROXY_MAX_IDLE_CONNS_PER_HOST:-20}"
      GATEWAY_GRPC_REQUEST_TIMEOUT_SECONDS: "${GATEWAY_GRPC_REQUEST_TIMEOUT_SECONDS:-10}"
      GATEWAY_GRPC_MIN_CONNECT_TIMEOUT_SECONDS: "${GATEWAY_GRPC_MIN_CONNECT_TIMEOUT_SECONDS:-5}"
      GATEWAY_GRPC_TLS_ENABLED: "${GATEWAY_GRPC_TLS_ENABLED:-false}"
      GATEWAY_GRPC_TLS_CA_FILE: "${GATEWAY_GRPC_TLS_CA_FILE:-}"
      GATEWAY_GRPC_TLS_CERT_FILE: "${GATEWAY_GRPC_TLS_CERT_FILE:-}"
      GATEWAY_GRPC_TLS_KEY_FILE: "${GATEWAY_GRPC_TLS_KEY_FILE:-}"
      GATEWAY_GRPC_TLS_SERVER_NAME: "${GATEWAY_GRPC_TLS_SERVER_NAME:-}"
      GATEWAY_READINESS_TIMEOUT_SECONDS: "${GATEWAY_READINESS_TIMEOUT_SECONDS:-3}"
      COOKIE_NAME: "${COOKIE_NAME:-refresh_token}"
      COOKIE_PATH: "${COOKIE_PATH:-/}"
      COOKIE_DOMAIN: "${COOKIE_DOMAIN:-}"
      COOKIE_MAX_AGE_SECONDS: "${COOKIE_MAX_AGE_SECONDS:-2592000}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      COOKIE_HTTP_ONLY: "${COOKIE_HTTP_ONLY:-true}"
      COOKIE_SAMESITE: "${COOKIE_SAMESITE:-lax}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=Host(`localhost`) && (PathPrefix(`/api/v1`) || PathPrefix(`/health`))"
      - "traefik.http.services.gateway.loadbalancer.server.port=8081"
      - "traefik.docker.network=proxy_net"
    networks:
      - proxy_net
      - dcm_net
    depends_on:
      - sso
      - core
      - builder

networks:
  proxy_net:
    external: true
  dcm_net:
    name: dcm_net
  build_net:
    name: build_net

volumes:
  builder_storage:
  builder_logs:
  rabbitmq_data:
  minio_data:
