version: "2"
run:
  timeout: 3m

output:
  sort-results: true

linters:
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
    - depguard
  settings:
    depguard:
      rules:
        service-and-model-purity:
          files:
            - "**/internal/*/service/**"
            - "**/internal/*/model/**"
            - "**/internal/*/config/**"
          deny:
            - pkg: database/sql
              desc: services and models do not use SQL directly
            - pkg: github.com/lib/pq
              desc: services and models do not use SQL drivers
            - pkg: github.com/docker/docker
              desc: services and models do not use the Docker SDK
            - pkg: github.com/gin-gonic/gin
              desc: services and models do not use HTTP frameworks
            - pkg: google.golang.org/grpc
              desc: services and models do not use gRPC
            - pkg: google.golang.org/protobuf
              desc: services and models do not use protobuf
            - pkg: github.com/callmerussell04/docker-cloud-manager/api
              desc: services and models do not use generated contracts
            - pkg: github.com/callmerussell04/docker-cloud-manager/pkg/httpresponse
              desc: transport mapping belongs to transports
            - pkg: github.com/callmerussell04/docker-cloud-manager/pkg/grpcerrors
              desc: transport mapping belongs to transports
            - pkg: github.com/callmerussell04/docker-cloud-manager/pkg/pgpool
              desc: database pools belong to the composition root
        shared-libraries:
          files:
            - "**/pkg/**"
          deny:
            - pkg: github.com/callmerussell04/docker-cloud-manager/internal
              desc: shared packages do not import bounded contexts
        builder-context:
          files:
            - "**/internal/builder/**"
            - "**/cmd/builder/**"
          deny:
            - pkg: github.com/callmerussell04/docker-cloud-manager/internal/core
              desc: contexts share code only through pkg, internalauth and api
            - pkg: github.com/callmerussell04/docker-cloud-manager/internal/gateway
              desc: contexts share code only through pkg, internalauth and api
            - pkg: github.com/callmerussell04/docker-cloud-manager/internal/sso
              desc: contexts share code only through pkg, internalauth and api
            - pkg: github.com/callmerussell04/docker-cloud-manager/internal/telemetry
              desc: contexts share code only through pkg, internalauth and api
        core-context:
          files:
            - "**/internal/core/**"
            - "**/cmd/core/**"
          deny:
            - pkg: github.com/callmerussell04/docker-cloud-manager/internal/builder
              desc: contexts share code only through pkg, internalauth and api
            - pkg: github.com/callmerussell04/docker-cloud-manager/internal/gateway
              desc: contexts share code only through pkg, internalauth and api
            - pkg: github.com/callmerussell04/docker-cloud-manager/internal/sso
              desc: contexts share code only through pkg, internalauth and api
            - pkg: github.com/callmerussell04/docker-cloud-manager/internal/telemetry
              desc: contexts share code only through pkg, internalauth and api
        gateway-context:
          files:
            - "**/internal/gateway/**"
            - "**/cmd/gateway/**"
          deny:
            - pkg: github.com/callmerussell04/docker-cloud-manager/internal/builder
              desc: contexts share code only through pkg, internalauth and api
            - pkg: github.com/callmerussell04/docker-cloud-manager/internal/core
              desc: contexts share code only through pkg, internalauth and api
            - pkg: github.com/callmerussell04/docker-cloud-manager/internal/sso
              desc: contexts share code only through pkg, internalauth and api
            - pkg: github.com/callmerussell04/docker-cloud-manager/internal/telemetry
              desc: contexts share code only through pkg, internalauth and api
        sso-context:
          files:
            - "**/internal/sso/**"
            - "**/cmd/sso/**"
          deny:
            - pkg: github.com/callmerussell04/docker-cloud-manager/internal/builder
              desc: contexts share code only through pkg, internalauth and api
            - pkg: github.com/callmerussell04/docker-cloud-manager/internal/core
              desc: contexts share code only through pkg, internalauth and api
            - pkg: github.com/callmerussell04/docker-cloud-manager/internal/gateway
              desc: contexts share code only through pkg, internalauth and api
            - pkg: github.com/callmerussell04/docker-cloud-manager/internal/telemetry
              desc: contexts share code only through pkg, internalauth and api
        telemetry-context:
          files:
            - "**/internal/telemetry/**"
            - "**/cmd/telemetry/**"
          deny:
            - pkg: github.com/callmerussell04/docker-cloud-manager/internal/builder
              desc: contexts share code only through pkg, internalauth and api
            - pkg: github.com/callmerussell04/docker-cloud-manager/internal/core
              desc: contexts share code only through pkg, internalauth and api
            - pkg: github.com/callmerussell04/docker-cloud-manager/internal/gateway
              desc: contexts share code only through pkg, internalauth and api
            - pkg: github.com/callmerussell04/docker-cloud-manager/internal/sso
              desc: contexts share code only through pkg, internalauth and api
    errcheck:
      # Non-actionable database/sql cleanup: Rows.Close after iteration reports its
      # failure through Rows.Err, and Tx.Rollback after Commit returns ErrTxDone.
      # Stmt.Close only releases a prepared statement already executed or failed.
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (*database/sql.Stmt).Close

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-dirs:
    - migrations
