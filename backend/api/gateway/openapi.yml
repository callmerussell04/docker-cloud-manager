openapi: 3.0.3
info:
  title: Docker Cloud Manager API
  description: Self-hosted PaaS API for managing Docker containers, volumes, images, builds, and compose projects.
  version: 1.0.0
servers:
  - url: /api/v1
    description: Gateway Service API

security:
  - BearerAuth: []

paths:
  /health/live:
    get:
      summary: Liveness probe
      tags: [Health]
      security: []
      servers:
        - url: /
      responses:
        '200':
          description: Gateway process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /health/ready:
    get:
      summary: Readiness probe
      tags: [Health]
      security: []
      servers:
        - url: /
      responses:
        '200':
          description: Gateway and upstream dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '503':
          description: One or more upstream dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'

  # ================= AUTH =================
  /auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      summary: Login to get access and refresh tokens
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          headers:
            Set-Cookie:
              description: Refresh token cookie (refresh_token)
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      summary: Refresh access token using cookie
      tags: [Auth]
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Token refreshed successfully
          headers:
            Set-Cookie:
              description: New refresh token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      summary: Logout user (clears refresh token cookie)
      tags: [Auth]
      security: []
      responses:
        '200':
          description: Successfully logged out

  # ================= CONTAINERS =================
  /containers:
    get:
      summary: Get all containers for current user
      tags: [Containers]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of containers
          content:
            application/json:
              schema:
                type: object
                properties:
                  containers:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserContainer'
                  total_count:
                    type: integer
                    format: int64
    post:
      summary: Create a new container
      tags: [Containers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContainerRequest'
      responses:
        '201':
          description: Container created
          content:
            application/json:
              schema:
                type: object
                properties:
                  container_id:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /containers/{id}/action/{action}:
    post:
      summary: Perform action on a container (start, stop, delete)
      tags: [Containers]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [start, stop, delete]
      responses:
        '200':
          description: Action performed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /containers/{id}/expose:
    post:
      summary: Expose container to the internet via Traefik
      tags: [Containers]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExposeContainerRequest'
      responses:
        '200':
          description: Container exposed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /containers/{id}/stats:
    get:
      summary: Get real-time container stats (CPU, RAM, Network)
      tags: [Containers]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Container stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerStats'

  /containers/{id}/logs/stream:
    get:
      summary: Stream container logs in real time
      tags: [Containers]
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/LogTailParam'
        - $ref: '#/components/parameters/LogSinceParam'
        - $ref: '#/components/parameters/LogTimestampsParam'
        - $ref: '#/components/parameters/LogFollowParam'
        - $ref: '#/components/parameters/TelemetryTicketParam'
      responses:
        '200':
          description: Server-Sent Events stream with log, error, and end events
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /containers/{id}/logs/stream/ticket:
    post:
      summary: Issue a short-lived browser ticket for container logs
      tags: [Containers]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '201':
          description: Telemetry stream ticket issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryTicketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /containers/{id}/terminal:
    get:
      summary: Open an interactive terminal session for a running container
      tags: [Containers]
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/TerminalCommandParam'
        - $ref: '#/components/parameters/TerminalArgParam'
        - $ref: '#/components/parameters/TerminalRowsParam'
        - $ref: '#/components/parameters/TerminalColsParam'
        - $ref: '#/components/parameters/TelemetryTicketParam'
      responses:
        '101':
          description: WebSocket upgrade accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /containers/{id}/terminal/ticket:
    post:
      summary: Issue a short-lived browser ticket for a container terminal
      tags: [Containers]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '201':
          description: Telemetry terminal ticket issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryTicketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ================= VOLUMES =================
  /volumes:
    get:
      summary: Get all volumes for current user
      tags: [Volumes]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of volumes
          content:
            application/json:
              schema:
                type: object
                properties:
                  volumes:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserVolume'
                  total_count:
                    type: integer
                    format: int64
    post:
      summary: Create a new volume
      tags: [Volumes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVolumeRequest'
      responses:
        '201':
          description: Volume created
          content:
            application/json:
              schema:
                type: object
                properties:
                  volume_id:
                    type: string
                    format: uuid
        '409':
          $ref: '#/components/responses/Conflict'

  /volumes/{id}:
    delete:
      summary: Delete a volume
      tags: [Volumes]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Volume deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  # ================= IMAGES & BUILDER =================
  /images:
    get:
      summary: Get all images for current user
      tags: [Images]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of images
          content:
            application/json:
              schema:
                type: object
                properties:
                  images:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserImage'
                  total_count:
                    type: integer
                    format: int64

  /images/{id}:
    delete:
      summary: Delete an image
      tags: [Images]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Image deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /images/build:
    post:
      summary: Build a new image from source archive
      description: Multipart metadata fields (`tag`, optional `context`, `dockerfile`, `build_args`) must be sent before the `archive` file part. Non-file fields are limited to 1 MiB each.
      tags: [Images]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - tag
                - archive
              properties:
                tag:
                  type: string
                  description: "Image tag (e.g. my-app:v1)"
                context:
                  type: string
                  description: "Build context directory inside archive (default: .)"
                dockerfile:
                  type: string
                  description: "Dockerfile path inside context (default: Dockerfile)"
                build_args:
                  type: string
                  description: "JSON string of build arguments (e.g. {\"ENV\":\"prod\"})"
                archive:
                  type: string
                  format: binary
                  description: ".zip, .tar, or .tar.gz archive containing source code"
      responses:
        '202':
          description: Build job accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  build_id:
                    type: string
                    format: uuid
                  message:
                    type: string
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /images/build/availability:
    get:
      summary: Get image build availability
      tags: [Images]
      responses:
        '200':
          description: Current image build availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  message:
                    type: string

  # ================= BUILDS =================
  /builds:
    get:
      summary: Get user builds history
      tags: [Builds]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of builds
          content:
            application/json:
              schema:
                type: object
                properties:
                  builds:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserBuild'
                  total_count:
                    type: integer
                    format: int64

  /builds/{id}:
    delete:
      summary: Delete a build record
      tags: [Builds]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Build record deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /builds/{id}/logs:
    get:
      summary: Get logs for a specific build
      tags: [Builds]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Plain text logs stream
          content:
            text/plain:
              schema:
                type: string

  /builds/{id}/cancel:
    post:
      summary: Cancel a queued or running build
      tags: [Builds]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Build cancellation requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ================= PROJECTS (COMPOSE) =================
  /projects:
    get:
      summary: Get all compose projects for current user
      tags: [Projects]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserProject'
                  total_count:
                    type: integer
                    format: int64

  /projects/compose:
    post:
      summary: Deploy a new Docker Compose project
      tags: [Projects]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - project_name
                - archive
              properties:
                project_name:
                  type: string
                  description: "Name of the compose project"
                archive:
                  type: string
                  format: binary
                  description: ".zip archive containing docker-compose.yml and sources"
      responses:
        '202':
          description: Compose deployment accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id:
                    type: string
                    format: uuid
                  message:
                    type: string

  /projects/{id}:
    delete:
      summary: Delete a compose project and its resources
      tags: [Projects]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Project deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /projects/{id}/start:
    post:
      summary: Start all containers in a compose project
      tags: [Projects]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Project started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /projects/{id}/stop:
    post:
      summary: Stop all containers in a compose project
      tags: [Projects]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Project stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /projects/{id}/cancel:
    post:
      summary: Cancel an active compose deployment
      tags: [Projects]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Project cancellation requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  # ================= STATS =================
  /stats:
    get:
      summary: Get usage statistics for current user
      tags: [Stats]
      responses:
        '200':
          description: User statistics and quotas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStats'

  # ================= ADMIN =================
  /admin/config:
    get:
      summary: Get system runtime configuration
      tags: [Admin]
      responses:
        '200':
          description: System configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfig'
    put:
      summary: Update system runtime configuration dynamically
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemConfig'
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /admin/users:
    get:
      summary: Get paginated list of users
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUsers'
    post:
      summary: Create a user as admin
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/users/{id}:
    get:
      summary: Get a user by id
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update a user as admin
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdminUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Deactivate a user
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: User deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/users/{id}/activate:
    post:
      summary: Reactivate a user
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: User reactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/containers:
    get:
      summary: Get paginated list of all containers (all users)
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated containers
          content:
            application/json:
              schema:
                type: object
                properties:
                  containers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Container'
                  total_count:
                    type: integer

  /admin/containers/{id}/action/{action}:
    post:
      summary: Admin action on any container
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [start, stop, delete]
      responses:
        '200':
          description: Admin action successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /admin/containers/{id}/stats:
    get:
      summary: Admin get container stats
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Container stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerStats'

  /admin/containers/{id}/logs/stream:
    get:
      summary: Admin stream logs for any container
      tags: [Admin]
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/LogTailParam'
        - $ref: '#/components/parameters/LogSinceParam'
        - $ref: '#/components/parameters/LogTimestampsParam'
        - $ref: '#/components/parameters/LogFollowParam'
        - $ref: '#/components/parameters/TelemetryTicketParam'
      responses:
        '200':
          description: Server-Sent Events stream with log, error, and end events
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/containers/{id}/logs/stream/ticket:
    post:
      summary: Admin issue a short-lived browser ticket for any container logs
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '201':
          description: Telemetry stream ticket issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryTicketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/containers/{id}/terminal:
    get:
      summary: Admin open an interactive terminal session for any running container
      tags: [Admin]
      security:
        - BearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/TerminalCommandParam'
        - $ref: '#/components/parameters/TerminalArgParam'
        - $ref: '#/components/parameters/TerminalRowsParam'
        - $ref: '#/components/parameters/TerminalColsParam'
        - $ref: '#/components/parameters/TelemetryTicketParam'
      responses:
        '101':
          description: WebSocket upgrade accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/containers/{id}/terminal/ticket:
    post:
      summary: Admin issue a short-lived browser ticket for any container terminal
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '201':
          description: Telemetry terminal ticket issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryTicketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/volumes:
    get:
      summary: Get paginated list of all volumes (all users)
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated volumes
          content:
            application/json:
              schema:
                type: object
                properties:
                  volumes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Volume'
                  total_count:
                    type: integer

  /admin/volumes/{id}:
    delete:
      summary: Admin delete any volume
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Volume deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /admin/images:
    get:
      summary: Get paginated list of all images (all users)
