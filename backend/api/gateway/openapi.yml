components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token obtained from /auth/login or /auth/refresh
    CookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token
    OIDCStateCookie:
      type: apiKey
      in: cookie
      # The real name is per attempt: oidc_state_ plus the first 16 hex characters
      # of the SHA-256 of the attempt's state.
      name: oidc_state_<hash>
    TelemetryTicketAuth:
      type: apiKey
      in: query
      name: ticket
      description: Short-lived, opaque, single-use ticket issued by the matching ticket endpoint.

  parameters:
    CookieOrigin:
      in: header
      name: Origin
      description: Exact browser origin in CORS_ALLOWED_ORIGINS; required unless an allowed Referer is supplied.
      schema:
        type: string
    CookieReferer:
      in: header
      name: Referer
      description: Used only when Origin is absent; its origin must be in CORS_ALLOWED_ORIGINS.
      schema:
        type: string
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    FromParam:
      name: from
      in: query
      required: false
      description: Inclusive Unix timestamp; 0 lets the service choose the default range.
      schema:
        type: integer
        format: int64
        minimum: 0
    ToParam:
      name: to
      in: query
      required: false
      description: Inclusive Unix timestamp; 0 means the current service-defined upper bound.
      schema:
        type: integer
        format: int64
        minimum: 0
    LogTailParam:
      name: tail
      in: query
      required: false
      schema:
        type: integer
        default: 200
        minimum: 1
    LogSinceParam:
      name: since
      in: query
      required: false
      description: Unix timestamp or RFC3339 timestamp.
      schema:
        type: string
    LogTimestampsParam:
      name: timestamps
      in: query
      required: false
      schema:
        type: boolean
        default: true
    LogFollowParam:
      name: follow
      in: query
      required: false
      schema:
        type: boolean
        default: true
    TerminalCommandParam:
      name: cmd
      in: query
      required: false
      description: Allowed exec command. Defaults to the first configured shell.
      schema:
        type: string
    TerminalArgParam:
      name: arg
      in: query
      required: false
      description: Repeated command arguments.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    TerminalRowsParam:
      name: rows
      in: query
      required: false
      schema:
        type: integer
        default: 24
        minimum: 1
    TerminalColsParam:
      name: cols
      in: query
      required: false
      schema:
        type: integer
        default: 80
        minimum: 1
    TelemetryTicketParam:
      name: ticket
      in: query
      required: true
      description: Short-lived browser stream ticket from the matching ticket endpoint.
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized (Invalid or missing token)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden (Not enough permissions)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict (e.g. quota exceeded, resource in use)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Upstream dependency is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GatewayTimeout:
      description: Upstream request timed out
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        error_code:
          type: string
        limit:
          type: string
          description: >-
            The limit a rejected request exceeded. Present only when the
            rejection names one; several limits share one error_code. Clients
            must tolerate values added later.
          enum:
            - user_memory
            - user_cpu
            - user_disk
            - host_memory
            - host_cpu
            - disk_floor
            - containers_per_user
            - volumes_per_user
            - queued_container_creates
            - queued_builds
            - queued_compose_deployments
            - staged_source_bytes
        request_id:
          type: string

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    TelemetryTicketResponse:
      type: object
      properties:
        ticket:
          type: string
          description: Opaque, short-lived, single-use browser stream ticket.
        expires_at:
          type: integer
          format: int64
          description: Unix timestamp when the ticket expires.

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          example: ok

    ReadinessStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum: [ok, unavailable]
              error:
                type: string

    # AUTH
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6

    LogoutResponse:
      type: object
      properties:
        provider_logout_url:
          type: string
          format: uri
          description: Present only for a session created through OIDC; the client navigates to it.
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthProvidersResponse:
      type: object
      required: [local_login_enabled, local_register_enabled, oidc_providers]
      properties:
        local_login_enabled:
          type: boolean
        local_register_enabled:
          type: boolean
        oidc_providers:
          type: array
          items:
            type: object
            required: [name, available]
            properties:
              name:
                type: string
                example: keycloak
              available:
                type: boolean
                description: False while SSO has not reached the enabled provider; sign-in through it answers 503 until then.

    # ADMIN USERS
    AdminUser:
      type: object
      description: SSO's user with the effective quota Core holds for them.
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, user]
        status:
          type: string
          enum: [active, deactivated]
        auth_source:
          type: string
          enum: [local, oidc]
          description: Where the account comes from. The identity provider owns an OIDC user's username, email and password, and updates that change them answer 400.
        role_managed_by_provider:
          type: boolean
          description: True for an OIDC user while SSO_OIDC_ADMIN_GROUPS is set. The identity provider then owns the role, and an update that changes it answers 400.
        quota_cpu:
          type: number
          format: double
          description: CPU quota in cores
        quota_ram_mb:
          type: integer
          format: int64
        quota_disk_mb:
          type: integer
          format: int64
        quota_custom:
          type: boolean
          description: False when the user has the default quota from the runtime settings

    AdminUserAccount:
      type: object
      description: A user's account as an account change returns it; quotas are read with the user.
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, user]
        status:
          type: string
          enum: [active, deactivated]
        auth_source:
          type: string
          enum: [local, oidc]
          description: Where the account comes from. The identity provider owns an OIDC user's username, email and password, and updates that change them answer 400.
        role_managed_by_provider:
          type: boolean
          description: True for an OIDC user while SSO_OIDC_ADMIN_GROUPS is set. The identity provider then owns the role, and an update that changes it answers 400.

    AdminUserDeactivation:
      description: The deactivated user and what happened to their workloads.
      allOf:
        - $ref: '#/components/schemas/AdminUserAccount'
        - type: object
          required: [workloads]
          properties:
            workloads:
              $ref: '#/components/schemas/WorkloadSuspension'

    AdminUserUpdate:
      description: The updated user. `workloads` is present only when the update left the account deactivated.
      allOf:
        - $ref: '#/components/schemas/AdminUserAccount'
        - type: object
          properties:
            workloads:
              $ref: '#/components/schemas/WorkloadSuspension'

    WorkloadSuspension:
      description: What deactivation did to the user's workloads.
      type: object
      required: [stopped_containers, canceled_builds, canceled_deployments, remaining]
      properties:
        stopped_containers:
          type: integer
          description: Containers a stop was queued for.
        canceled_builds:
          type: integer
        canceled_deployments:
          type: integer
        remaining:
          type: integer
          description: Workloads not yet stopped or canceled, because another operation was in progress or the attempt failed. Repeat the deactivation to handle them.

    PaginatedAdminUsers:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        total_count:
          type: integer

    CreateAdminUserRequest:
      type: object
      required: [username, email, password, role, status]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        role:
          type: string
          enum: [admin, user]
        status:
          type: string
          enum: [active, deactivated]

    UpdateAdminUserRequest:
      type: object
      required: [username, email, role, status]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        role:
          type: string
          enum: [admin, user]
        status:
          type: string
          enum: [active, deactivated]

    SetUserQuotaRequest:
      type: object
      required: [quota_cpu, quota_ram_mb, quota_disk_mb]
      properties:
        quota_cpu:
          type: number
          format: double
          description: CPU in cores, from 0.001 to 1000000
          minimum: 0
          exclusiveMinimum: true
        quota_ram_mb:
          type: integer
          format: int64
          minimum: 1
        quota_disk_mb:
          type: integer
          format: int64
          minimum: 1

    UserQuota:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        quota_cpu:
          type: number
          format: double
          description: CPU quota in cores
        quota_ram_mb:
          type: integer
          format: int64
        quota_disk_mb:
          type: integer
          format: int64
        quota_custom:
          type: boolean
          description: False when the user has the default quota from the runtime settings

    # CONTAINERS
    CreateContainerRequest:
      type: object
      required: [name, image_tag]
      properties:
        name:
          type: string
        image_tag:
          type: string
        internal_port:
          type: integer
        env_vars:
          type: object
          additionalProperties:
            type: string
        volume_mounts:
          type: array
          items:
            $ref: '#/components/schemas/VolumeMountRequest'
        domain_prefix:
          type: string
          maxLength: 30
        memory_reservation_mb:
          type: integer
          format: int64
          description: >-
            Memory the container is promised whenever it runs, in MB (MiB). Absent or 0 takes
            default_memory_reservation_bytes. Outside 16 MB to 1 TiB is 400; above what the owner's
            memory quota leaves is 403 with limit user_memory. The memory limit and boost ceiling are
            derived from it. It cannot be changed after creation.
        cpu_reservation_millicores:
          type: integer
          format: int64
          description: >-
            CPU the container is promised whenever it runs, in millicores. Absent or 0 takes
            default_cpu_reservation_millicores. Outside 10 millicores to 1,000,000 cores is 400; above
            what the owner's CPU quota leaves is 403 with limit user_cpu. CPU shares, the CPU limit and
            the boost ceiling are derived from it. It cannot be changed after creation.

    VolumeMountRequest:
      type: object
      required: [volume_id, mount_path]
      properties:
        volume_id:
          type: string
          format: uuid
        mount_path:
          type: string
        is_readonly:
          type: boolean
          default: false

    ExposeContainerRequest:
      type: object
      required: [domain_prefix, internal_port]
      properties:
        domain_prefix:
          type: string
          maxLength: 30
        internal_port:
          type: integer
          minimum: 1

    UserContainer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        image_tag:
          type: string
        internal_port:
          type: integer
        domain_prefix:
          type: string
        status:
          type: string
        desired_status:
          type: string
        last_error:
          type: string
        last_exit_code:
          type: integer
          nullable: true
        ttl_deadline:
          type: integer
          format: int64
          description: Unix timestamp when the current run expires; 0 means no active auto-stop deadline.
        created_at:
          type: integer
          format: int64
          description: Unix timestamp
        memory_reservation_bytes:
          type: integer
          format: int64
          description: Memory the container is promised whenever it runs, chosen at create or the default of that time.
        cpu_reservation_millicores:
          type: integer
          format: int64
          description: CPU the container is promised whenever it runs, chosen at create or the default of that time.

    Container:
      type: object
      properties:
        id:
          type: string
          format: uuid
        docker_id:
          type: string
        project_id:
          type: string
          format: uuid
        name:
          type: string
        image_tag:
          type: string
        internal_port:
          type: integer
        domain_prefix:
          type: string
        status:
          type: string
        desired_status:
          type: string
        last_error:
          type: string
        last_exit_code:
          type: integer
          nullable: true
        ttl_deadline:
          type: integer
          format: int64
          description: Unix timestamp when the current run expires; 0 means no active auto-stop deadline.
        created_at:
          type: integer
          format: int64
          description: Unix timestamp
        owner_id:
          type: string
          format: uuid
        owner_username:
          type: string
        memory_reservation_bytes:
          type: integer
          format: int64
          description: Memory the container is promised whenever it runs, chosen at create or the default of that time.
        cpu_reservation_millicores:
          type: integer
          format: int64
          description: CPU the container is promised whenever it runs, chosen at create or the default of that time.

    ContainerStats:
      type: object
      properties:
        cpu_percentage:
          type: number
          format: double
        memory_usage_bytes:
          type: integer
          format: int64
        memory_limit_bytes:
          type: integer
          format: int64
          description: The memory limit the container runs with now.
        memory_standard_limit_bytes:
          type: integer
          format: int64
          description: The limit create and start apply. A current limit above it is borrowed and may be reclaimed.
        network_rx_bytes:
          type: integer
          format: int64
        network_tx_bytes:
          type: integer
          format: int64

    # VOLUMES
    CreateVolumeRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        size_bytes:
          type: integer
          format: int64
          description: Size reserved against the owner's disk quota. Omitted or 0 uses default_volume_size_bytes; otherwise at least 1048576 (1 MiB). The size cannot change after creation. A size below 1 MiB is rejected with 400; a size that does not fit what the owner's images and volume sizes leave of the disk quota is rejected with 409 (user disk quota exceeded).

    Volume:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        docker_name:
          type: string
        status:
          type: string
        last_error:
          type: string
        used_bytes:
          type: integer
          format: int64
        usage_observed_at:
          type: integer
          format: int64
        size_bytes:
          type: integer
          format: int64
          description: Size reserved against the owner's disk quota. A volume measured above it counts with its measurement, and the running containers that mount it writable are stopped.
        size_enforced:
          type: boolean
          description: True when the kernel refuses writes past size_bytes; false when the size is only checked periodically, so usage can briefly exceed it.
        created_at:
          type: integer
          format: int64
        owner_id:
          type: string
          format: uuid
        owner_username:
          type: string
        used_by:
          type: array
          description: The containers that mount the volume, by name; empty when none does. A volume in use cannot be deleted (409).
          items:
            $ref: '#/components/schemas/VolumeUser'

    VolumeUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The container's ID.
        name:
          type: string
          description: The container's name.

    UserVolume:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
        last_error:
          type: string
        used_bytes:
          type: integer
          format: int64
        usage_observed_at:
          type: integer
          format: int64
        size_bytes:
          type: integer
          format: int64
          description: Size reserved against the owner's disk quota. A volume measured above it counts with its measurement, and the running containers that mount it writable are stopped.
        size_enforced:
          type: boolean
          description: True when the kernel refuses writes past size_bytes; false when the size is only checked periodically, so usage can briefly exceed it.
        created_at:
          type: integer
          format: int64
        used_by:
          type: array
          description: The containers that mount the volume, by name; empty when none does. A volume in use cannot be deleted (409).
          items:
            $ref: '#/components/schemas/VolumeUser'

    # IMAGES
    UserImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tag:
          type: string
        size_bytes:
          type: integer
          format: int64
          description: Image size in bytes, as the Registry reports it.
        status:
          type: string
        last_error:
          type: string
        created_at:
          type: integer
          format: int64

    Image:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tag:
          type: string
        size_bytes:
          type: integer
          format: int64
          description: Image size in bytes, as the Registry reports it.
        status:
          type: string
        last_error:
          type: string
        created_at:
          type: integer
          format: int64
        owner_id:
          type: string
          format: uuid
        owner_username:
          type: string

    # BUILDS
    BuildImageGitRequest:
      type: object
      required: [repo_url, tag]
      properties:
        repo_url:
          type: string
          format: uri
          description: Public HTTPS repository URL without credentials.
        ref:
          type: string
        tag:
          type: string
        context:
          type: string
          default: .
        dockerfile:
          type: string
          default: Dockerfile
        build_args:
          type: object
          additionalProperties:
            type: string

    BuildAcceptedResponse:
      type: object
      required: [build_id, message]
      properties:
        build_id:
          type: string
          format: uuid
        message:
          type: string

    UserBuild:
      type: object
      properties:
        id:
          type: string
          format: uuid
        image_id:
          type: string
          format: uuid
          description: Omitted once the build's image record has been deleted.
        tag:
          type: string
          description: The image tag the build was queued for.
        project_id:
          type: string
          format: uuid
        project_service_name:
          type: string
        status:
          type: string
        created_at:
          type: integer
          format: int64
          description: Unix seconds when the build entered the queue.
        started_at:
          description: Unix seconds when execution was claimed; zero before execution.
          type: integer
          format: int64
        finished_at:
          type: integer
          format: int64

    Build:
      type: object
      properties:
        id:
          type: string
          format: uuid
        image_id:
          type: string
          format: uuid
          description: Omitted once the build's image record has been deleted.
        tag:
          type: string
          description: The image tag the build was queued for.
        project_id:
          type: string
          format: uuid
        project_service_name:
          type: string
        status:
          type: string
        created_at:
          type: integer
          format: int64
          description: Unix seconds when the build entered the queue.
        started_at:
          description: Unix seconds when execution was claimed; zero before execution.
          type: integer
          format: int64
        finished_at:
          type: integer
          format: int64
        log_object_key:
          type: string
        owner_id:
          type: string
          format: uuid
        owner_username:
          type: string

    # PROJECTS
    DeployComposeGitRequest:
      type: object
      required: [project_name, repo_url]
      properties:
        project_name:
          type: string
        repo_url:
          type: string
          format: uri
          description: Public HTTPS repository URL without credentials.
        ref:
          type: string
        compose_file:
          type: string
          description: Relative path to the Compose file in the repository.

    ComposeAcceptedResponse:
      type: object
      required: [project_id, message]
      properties:
        project_id:
          type: string
          format: uuid
        message:
          type: string

    UserProject:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
        error_message:
          type: string
        last_error:
          type: string
        created_at:
          type: integer
          format: int64

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
        error_message:
          type: string
        last_error:
          type: string
        created_at:
          type: integer
          format: int64
        owner_id:
          type: string
          format: uuid
        owner_username:
          type: string

    # STATS
    UserStats:
      type: object
      properties:
        containers_total:
          type: integer
        containers_running:
          type: integer
        containers_quota:
          type: integer
        ram_used_bytes:
          type: integer
          format: int64
        ram_quota_bytes:
          type: integer
          format: int64
        cpu_used_millicores:
          type: integer
          format: int64
          description: CPU the user's containers reserve.
        cpu_quota_millicores:
          type: integer
          format: int64
        disk_used_mb:
          type: integer
        disk_quota_mb:
          type: integer
        volumes_total:
          type: integer
        volumes_quota:
          type: integer
        images_total:
          type: integer
        projects_total:
          type: integer

    # SYSTEM CONFIG
    SystemMonitoring:
      type: object
      properties:
        cpu_percent: { type: number, format: double }
        memory_total_bytes: { type: integer, format: int64 }
        memory_used_bytes: { type: integer, format: int64 }
        memory_available_bytes: { type: integer, format: int64 }
        disk_total_bytes: { type: integer, format: int64 }
        disk_used_bytes: { type: integer, format: int64 }
        disk_free_bytes: { type: integer, format: int64 }
        dcm_reserved_memory_bytes: { type: integer, format: int64 }
        dcm_reserved_build_memory_bytes: { type: integer, format: int64 }
        dcm_borrowed_memory_bytes:
          type: integer
          format: int64
          description: Memory running containers and builds borrow above their standard limits, as the memory pressure worker last measured it. 0 before its first pass and while memory boost is off.
        dcm_disk_used_bytes: { type: integer, format: int64 }
        dcm_reserved_volume_bytes:
          type: integer
          format: int64
          description: The sum of the sizes of all volumes not being deleted, the disk promised to volumes.
        host_min_free_disk_bytes: { type: integer, format: int64 }
        admission_status: { type: string }
        admission_reasons:
          type: array
          items: { type: string }
        rootfs_quota_status:
          type: string
          enum: [enforced, not_enforced, unknown]
          description: Whether the container root filesystem cap (container_disk_quota) is enforced on this host, as Core classified Docker's storage driver at startup. not_enforced means Docker accepts the cap without applying it; unknown covers unlisted storage setups and a failed read.
        volume_size_mode:
          type: string
          enum: [measured, enforced, unavailable]
          description: How new volumes get their size. measured when volume_size_enforcement is off (sizes are checked periodically); enforced when it is on and the host supports volume sizes; unavailable when it is on but the host check failed at startup, so new volumes are created measured until a restart or a settings update that turns it on again passes the check.
        containers_total: { type: integer }
        containers_running: { type: integer }
        containers_stopped: { type: integer }
        containers_error: { type: integer }
        containers_missing: { type: integer }
        volumes_total: { type: integer }
        images_total: { type: integer }
        builds_total: { type: integer }
        projects_total: { type: integer }
        observed_at: { type: integer, format: int64, description: Unix timestamp }

    ReportsOverview:
      type: object
      properties:
        from: { type: integer, format: int64 }
        to: { type: integer, format: int64 }
        audit_events_total: { type: integer, format: int64 }
        failed_actions_total: { type: integer, format: int64 }
        active_users_total: { type: integer, format: int64 }
        memory_usage_bytes: { type: integer, format: int64 }
        reserved_memory_bytes: { type: integer, format: int64 }
        cpu_percent: { type: number, format: double }
        total_disk_bytes: { type: integer, format: int64 }
        resources_total: { type: integer, format: int64 }
        containers_total: { type: integer, format: int64 }
        containers_running: { type: integer, format: int64 }
        volumes_total: { type: integer, format: int64 }
        images_total: { type: integer, format: int64 }
        builds_total: { type: integer, format: int64 }
        projects_total: { type: integer, format: int64 }
        last_usage_snapshot_at: { type: integer, format: int64 }
        usage_snapshot_interval_seconds: { type: integer, format: int64 }
        top_actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionCount'

    ActionCount:
      type: object
      properties:
        action: { type: string }
        count: { type: integer, format: int64 }

    UserUsageReport:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserUsageReportItem'
        total_count: { type: integer }

    UserUsageReportItem:
      type: object
      properties:
        owner_id: { type: string, format: uuid }
        owner_username: { type: string }
        memory_usage_bytes: { type: integer, format: int64 }
        reserved_memory_bytes: { type: integer, format: int64 }
        cpu_percent: { type: number, format: double }
        total_disk_bytes: { type: integer, format: int64 }
        resources_total: { type: integer }
        containers_total: { type: integer }
        containers_running: { type: integer }
        volumes_total: { type: integer }
        images_total: { type: integer }
        builds_total: { type: integer }
        projects_total: { type: integer }
        actions_total: { type: integer, format: int64 }

    UserUsageTimeline:
      type: object
      properties:
        points:
          type: array
          items:
            $ref: '#/components/schemas/UserUsagePoint'

    UserUsagePoint:
      type: object
      properties:
        bucket_start: { type: integer, format: int64 }
        memory_usage_bytes: { type: integer, format: int64 }
        reserved_memory_bytes: { type: integer, format: int64 }
        cpu_percent: { type: number, format: double }
        total_disk_bytes: { type: integer, format: int64 }
        resources_total: { type: integer }
        containers_total: { type: integer }
        containers_running: { type: integer }
        volumes_total: { type: integer }
        images_total: { type: integer }
        builds_total: { type: integer }
        projects_total: { type: integer }
        actions_total: { type: integer, format: int64 }

    AuditEventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        total_count: { type: integer }

    AuditEvent:
      type: object
      properties:
        id: { type: string }
        occurred_at: { type: integer, format: int64 }
        actor_user_id: { type: string }
        actor_username: { type: string }
        actor_scope: { type: string }
        action: { type: string }
        outcome: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        resource_name: { type: string }
        owner_id: { type: string }
        owner_username: { type: string }
        request_id: { type: string }
        client_ip: { type: string }
        user_agent: { type: string }
        error_code: { type: string }
        details_json: { type: string, description: Safe JSON details serialized as a string. }

    RefreshUsageSnapshotsResponse:
      type: object
      properties:
        bucket_start: { type: integer, format: int64 }
        collected_at: { type: integer, format: int64 }
        snapshots_count: { type: integer }

    SystemConfig:
      type: object
      description: >-
        The runtime settings. A read returns all of them and an update sends all of them back;
        values fixed when Core starts are not part of this object.
      properties:
        default_memory_reservation_bytes:
          type: integer
          format: int64
          minimum: 16777216
          description: Memory reservation of a container created without its own figure. At least 16 MiB.
        reserved_system_memory_bytes:
          type: integer
          format: int64
        overcommit_factor:
          type: number
          format: double
        max_burst_multiplier:
          type: integer
          format: int64
        default_cpu_reservation_millicores:
          type: integer
          format: int64
          minimum: 10
          description: CPU reservation, in millicores, of a container created without its own figure. At least 10.
        reserved_system_cpu_millicores:
          type: integer
          format: int64
        cpu_overcommit_factor:
          type: number
          format: double
        max_cpu_burst_multiplier:
          type: integer
          format: int64
        container_stop_timeout:
          type: integer
        max_log_size:
          type: string
        container_disk_quota:
          type: string
        reserved_domain_prefixes:
          type: array
          items:
            type: string
        blocked_domain_prefix_patterns:
          type: array
          items:
            type: string
        max_volumes_per_user:
          type: integer
        max_containers_per_user:
          type: integer
        container_ttl_hours:
          type: integer
          format: int64
        container_pids_limit:
          type: integer
          format: int64
        image_builds_enabled:
          type: boolean
        build_memory_bytes:
          type: integer
          format: int64
        build_cpu_millicores:
          type: integer
          format: int64
          description: CPU of one build slot, in millicores; 1000 is one core.
        max_build_time_minutes:
          type: integer
          format: int64
        max_concurrent_builds:
          type: integer
        max_archive_size_bytes:
          type: integer
          format: int64
        max_unpacked_size_bytes:
          type: integer
          format: int64
        max_build_log_size_bytes:
          type: integer
          format: int64
        max_staged_source_bytes_per_user:
          type: integer
          format: int64
        max_queued_builds_per_user:
          type: integer
        compose_upload_max_bytes:
          type: integer
          format: int64
        compose_pipeline_timeout_minutes:
          type: integer
          format: int64
        max_queued_compose_deploys_per_user:
          type: integer
        build_max_disk_bytes:
          type: integer
          format: int64
          minimum: 67108864
          description: Disk one build may write. Each build slot holds it against the host disk floor, and Builder stops a build that writes more.
        compose_dependency_wait_timeout_minutes:
          type: integer
          format: int64
        host_min_free_disk_bytes:
          type: integer
          format: int64
        memory_pressure_min_free_bytes:
          type: integer
          format: int64
        memory_boost_multiplier:
          type: integer
          format: int64
          minimum: 1
          maximum: 64
          description: Boost ceiling as a multiple of the memory reservation. At or below max_burst_multiplier memory boost is off.
        cpu_boost_multiplier:
          type: integer
          format: int64
          minimum: 1
          maximum: 64
          description: CPU boost ceiling as a multiple of the CPU reservation, granted while the host CPU is idle. At or below max_cpu_burst_multiplier CPU boost is off.
        boost_min_free_memory_bytes:
          type: integer
          format: int64
          description: Free user memory that must remain after a boost is granted; below it boosted limits are lowered. At least memory_pressure_min_free_bytes.
        default_volume_size_bytes:
          type: integer
          format: int64
          minimum: 1048576
          description: Size of a volume created without one, including every volume a Compose deployment creates. At least 1 MiB.
        volume_size_enforcement:
          type: boolean
          description: Give each new volume's size to Docker so the kernel refuses writes past it. Turning it on runs a host check (a throwaway sized volume) and is rejected with 400 when the host does not support volume sizes. Volumes created earlier keep size_enforced false and stay checked periodically.
        default_user_quota_cpu:
          type: number
          format: double
          minimum: 0.001
          maximum: 1000000
          description: CPU quota, in cores, of every user without a custom quota. Core stores quotas and reads the defaults at each admission, so a change applies to every such user at their next request. At least 0.001 (one millicore).
        default_user_quota_ram_mb:
          type: integer
          format: int64
          minimum: 1
          description: Memory quota, in MB, of every user without a custom quota. Must be positive.
        default_user_quota_disk_mb:
          type: integer
          format: int64
          minimum: 1
          description: Disk quota, in MB, of every user without a custom quota. Must be positive.
        git_sources_enabled:
          type: boolean
        git_allowed_hosts:
          type: array
          items:
            type: string
        git_clone_timeout_seconds:
          type: integer
          format: int64
        git_max_repository_bytes:
          type: integer
          format: int64
        telemetry_terminal_idle_timeout_seconds:
          type: integer
          format: int64
        telemetry_terminal_max_duration_seconds:
          type: integer
          format: int64
        telemetry_allowed_exec_commands:
          type: array
          items:
            type: string
