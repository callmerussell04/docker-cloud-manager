  /admin/builds:
    get:
      summary: Get paginated list of all builds (all users)
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated builds
          content:
            application/json:
              schema:
                type: object
                properties:
                  builds:
                    type: array
                    items:
                      $ref: '#/components/schemas/Build'
                  total_count:
                    type: integer

  /admin/builds/{id}:
    delete:
      summary: Admin delete any build record
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Build deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /admin/builds/{id}/logs:
    get:
      summary: Admin get logs for any build
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Plain text logs stream
          content:
            text/plain:
              schema:
                type: string

  /admin/builds/{id}/cancel:
    post:
      summary: Admin cancel a queued or running build
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Build cancellation requested
          content:
            application/json:
