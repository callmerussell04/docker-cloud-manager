  /admin/projects:
    get:
      summary: Get paginated list of all projects (all users)
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  total_count:
                    type: integer

  /admin/projects/{id}:
    delete:
      summary: Admin delete any project
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Project deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /admin/projects/{id}/start:
    post:
      summary: Admin start any project
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Project started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /admin/projects/{id}/stop:
    post:
      summary: Admin stop any project
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Project stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /admin/projects/{id}/cancel:
    post:
      summary: Admin cancel an active compose deployment
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Project cancellation requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'


components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token obtained from /auth/login or /auth/refresh
    CookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    LogTailParam:
      name: tail
      in: query
      required: false
      schema:
        type: integer
        default: 200
        minimum: 1
    LogSinceParam:
      name: since
      in: query
      required: false
      description: Unix timestamp or RFC3339 timestamp.
      schema:
        type: string
    LogTimestampsParam:
      name: timestamps
      in: query
      required: false
      schema:
        type: boolean
        default: true
    LogFollowParam:
      name: follow
      in: query
      required: false
      schema:
        type: boolean
        default: true
    TerminalCommandParam:
      name: cmd
      in: query
      required: false
      description: Allowed exec command. Defaults to the first configured shell.
      schema:
        type: string
    TerminalArgParam:
      name: arg
      in: query
      required: false
      description: Repeated command arguments.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    TerminalRowsParam:
      name: rows
      in: query
      required: false
      schema:
        type: integer
        default: 24
        minimum: 1
    TerminalColsParam:
      name: cols
      in: query
      required: false
      schema:
        type: integer
        default: 80
        minimum: 1
    TelemetryTicketParam:
      name: ticket
      in: query
      required: false
      description: Short-lived browser stream ticket from the matching ticket endpoint.
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized (Invalid or missing token)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden (Not enough permissions)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict (e.g. quota exceeded, resource in use)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Upstream dependency is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GatewayTimeout:
      description: Upstream request timed out
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        error_code:
          type: string
        request_id:
          type: string

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    TelemetryTicketResponse:
      type: object
      properties:
        ticket:
          type: string
          description: Opaque, short-lived, single-use browser stream ticket.
        expires_at:
          type: integer
          format: int64
          description: Unix timestamp when the ticket expires.

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          example: ok

    ReadinessStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum: [ok, unavailable]
              error:
                type: string

    # AUTH
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    # ADMIN USERS
    AdminUser:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, user]
        status:
          type: string
          enum: [active, deactivated]
        quota_cpu:
          type: number
          format: double
        quota_ram_mb:
          type: integer
          format: int64
        quota_disk_mb:
          type: integer
          format: int64

    PaginatedAdminUsers:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        total_count:
          type: integer

    CreateAdminUserRequest:
      type: object
      required: [username, email, password, role, status, quota_cpu, quota_ram_mb, quota_disk_mb]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        role:
          type: string
          enum: [admin, user]
        status:
          type: string
          enum: [active, deactivated]
        quota_cpu:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        quota_ram_mb:
          type: integer
          format: int64
          minimum: 1
        quota_disk_mb:
          type: integer
          format: int64
          minimum: 1

    UpdateAdminUserRequest:
      type: object
      required: [username, email, role, status, quota_cpu, quota_ram_mb, quota_disk_mb]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        role:
          type: string
          enum: [admin, user]
        status:
          type: string
          enum: [active, deactivated]
        quota_cpu:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        quota_ram_mb:
          type: integer
          format: int64
          minimum: 1
        quota_disk_mb:
          type: integer
          format: int64
          minimum: 1

    # CONTAINERS
    CreateContainerRequest:
      type: object
      required: [name, image_tag]
      properties:
        name:
          type: string
        image_tag:
          type: string
        internal_port:
          type: integer
        env_vars:
          type: object
          additionalProperties:
            type: string
        volume_mounts:
          type: array
          items:
            $ref: '#/components/schemas/VolumeMountRequest'
        domain_prefix:
          type: string
          maxLength: 30

    VolumeMountRequest:
      type: object
      required: [volume_id, mount_path]
      properties:
        volume_id:
          type: string
          format: uuid
        mount_path:
          type: string
        is_readonly:
          type: boolean
          default: false

    ExposeContainerRequest:
      type: object
      required: [domain_prefix, internal_port]
      properties:
        domain_prefix:
          type: string
          maxLength: 30
        internal_port:
          type: integer
          minimum: 1

    UserContainer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        image_tag:
          type: string
        internal_port:
          type: integer
        domain_prefix:
          type: string
        status:
          type: string
        desired_status:
          type: string
        last_error:
          type: string
        created_at:
          type: integer
          format: int64
          description: Unix timestamp

    Container:
      type: object
      properties:
        id:
          type: string
          format: uuid
        docker_id:
          type: string
        name:
          type: string
        image_tag:
          type: string
        internal_port:
          type: integer
        domain_prefix:
          type: string
        status:
          type: string
        desired_status:
          type: string
        last_error:
          type: string
        created_at:
          type: integer
          format: int64
          description: Unix timestamp
        owner_id:
          type: string
          format: uuid
        owner_username:
          type: string

    ContainerStats:
      type: object
      properties:
        cpu_percentage:
          type: number
          format: double
        memory_usage_bytes:
          type: integer
          format: int64
        memory_limit_bytes:
          type: integer
          format: int64
        network_rx_bytes:
          type: integer
          format: int64
        network_tx_bytes:
          type: integer
          format: int64

    # VOLUMES
    CreateVolumeRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    Volume:
      type: object
      properties:
        id:
          type: string
          format: uuid
        docker_name:
          type: string
        status:
          type: string
        last_error:
          type: string
        created_at:
          type: integer
          format: int64
        owner_id:
          type: string
          format: uuid
        owner_username:
          type: string

    UserVolume:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        last_error:
          type: string
        created_at:
          type: integer
          format: int64

    # IMAGES
    UserImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tag:
          type: string
        size_mb:
          type: integer
        status:
          type: string
        last_error:
          type: string
        created_at:
          type: integer
          format: int64

    Image:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tag:
          type: string
        size_mb:
          type: integer
        status:
          type: string
        last_error:
          type: string
        created_at:
          type: integer
          format: int64
        owner_id:
          type: string
          format: uuid
        owner_username:
          type: string

    # BUILDS
    UserBuild:
      type: object
      properties:
        id:
          type: string
          format: uuid
        image_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        project_service_name:
          type: string
        status:
          type: string
        started_at:
          type: integer
          format: int64
        finished_at:
          type: integer
          format: int64

    Build:
      type: object
      properties:
        id:
          type: string
          format: uuid
        image_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        project_service_name:
          type: string
        status:
          type: string
        started_at:
          type: integer
          format: int64
        finished_at:
          type: integer
          format: int64
        log_file_path:
          type: string
        owner_id:
          type: string
          format: uuid
        owner_username:
          type: string

    # PROJECTS
    UserProject:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
        error_message:
          type: string
        last_error:
          type: string
        created_at:
          type: integer
          format: int64

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
        error_message:
          type: string
        last_error:
          type: string
        created_at:
          type: integer
          format: int64
        owner_id:
          type: string
          format: uuid
        owner_username:
          type: string

    # STATS
    UserStats:
      type: object
      properties:
        containers_total:
          type: integer
        containers_running:
          type: integer
        containers_quota:
          type: integer
        ram_used_bytes:
          type: integer
          format: int64
        ram_quota_bytes:
          type: integer
          format: int64
        disk_used_mb:
          type: integer
        disk_quota_mb:
          type: integer
        volumes_total:
          type: integer
        volumes_quota:
          type: integer
        images_total:
          type: integer
        projects_total:
          type: integer

    # SYSTEM CONFIG
    SystemConfig:
      type: object
      properties:
        base_domain:
          type: string
        default_memory_reservation_bytes:
          type: integer
          format: int64
        reserved_system_memory_bytes:
          type: integer
          format: int64
        overcommit_factor:
          type: number
          format: double
        max_burst_multiplier:
          type: integer
          format: int64
        default_cpu_shares:
          type: integer
          format: int64
        high_load_cpu_shares:
          type: integer
          format: int64
        high_load_container_count:
          type: integer
        container_stop_timeout:
          type: integer
        max_log_size:
          type: string
        max_log_files:
          type: string
        container_disk_quota:
          type: string
        max_volumes_per_user:
          type: integer
        max_containers_per_user:
          type: integer
        registry_api_url:
          type: string
        registry_public_url:
          type: string
        container_ttl_hours:
          type: integer
          format: int64
        container_pids_limit:
          type: integer
          format: int64
        container_memory_swap_multiplier:
          type: number
          format: double
        proxy_network_name:
          type: string
        registry_container_name:
          type: string
        build_memory_bytes:
          type: integer
          format: int64
        build_cpu_quota:
          type: integer
          format: int64
        build_cpu_period:
          type: integer
          format: int64
        build_memory_swap_multiplier:
          type: number
          format: double
        build_pids_limit:
          type: integer
          format: int64
        build_network_name:
          type: string
        kaniko_image:
          type: string
        max_build_time_minutes:
          type: integer
          format: int64
        max_concurrent_builds:
          type: integer
        max_upload_size_bytes:
          type: integer
          format: int64
        max_archive_size_bytes:
          type: integer
          format: int64
        max_unpacked_size_bytes:
          type: integer
          format: int64
        max_build_log_size_bytes:
          type: integer
          format: int64
        ttl_worker_interval_seconds:
          type: integer
          format: int64
        gc_worker_interval_minutes:
          type: integer
          format: int64
        stale_build_timeout_minutes:
          type: integer
          format: int64
        event_sync_interval_seconds:
          type: integer
          format: int64
        event_reconnect_delay_seconds:
          type: integer
          format: int64
        build_outbox_interval_seconds:
          type: integer
          format: int64
        build_outbox_batch_size:
          type: integer
        compose_upload_max_bytes:
          type: integer
          format: int64
        compose_pipeline_timeout_minutes:
          type: integer
          format: int64
        build_cancel_poll_interval_seconds:
          type: integer
          format: int64
        compose_build_poll_interval_seconds:
          type: integer
          format: int64
        compose_dependency_wait_timeout_minutes:
          type: integer
          format: int64
        compose_dependency_poll_interval_seconds:
          type: integer
          format: int64
        telemetry_max_log_tail_lines:
          type: integer
        telemetry_max_log_streams_per_user:
          type: integer
        telemetry_max_terminal_sessions_per_user:
          type: integer
        telemetry_terminal_idle_timeout_seconds:
          type: integer
          format: int64
        telemetry_terminal_max_duration_seconds:
          type: integer
          format: int64
        telemetry_allowed_exec_commands:
          type: array
          items:
            type: string
        telemetry_max_command_args:
          type: integer
        telemetry_max_command_arg_bytes:
          type: integer
        telemetry_ws_read_limit_bytes:
          type: integer
          format: int64
