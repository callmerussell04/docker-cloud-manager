            schema:
              $ref: '#/components/schemas/CreateAdminUserRequest'
      responses:
        '201':
          description: User created, with the default quota until one is set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/users/{id}:
    get:
      summary: Get a user by id
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      summary: Update a user as admin
      description: |
        Saves the account in SSO. An update that leaves `status` as
        `deactivated` is a deactivation: Core then stops the user's
        workloads exactly as `DELETE /admin/users/{id}` does, the answer
        carries `workloads`, and it is audited as a deactivation. When Core
        cannot be reached the account is still saved as deactivated and the
        answer is `503`; repeating the request is safe. Any other update
        answers without `workloads` and stops nothing.

        For an OIDC user (`auth_source` is `oidc`) the identity provider owns
        the username, email and password: an update that changes the
        username or email, or sets a password, answers `400` with
        `username, email and password of this user are managed by the
        identity provider`. While `role_managed_by_provider` is true, an
        update that changes the role answers `400` with `role of this user
        is managed by the identity provider`. Status changes stay allowed.
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdminUserRequest'
      responses:
        '200':
          description: User updated; with `workloads` when the update left the account deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserUpdate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      summary: Deactivate a user and stop their workloads
      description: |
        Deactivates the user in SSO, then has Core stop their workloads: a
        stop is queued for every container that is running or meant to run
        (its `last_error` then reads `stopped by the platform: the account
        that owns this container was deactivated` until its next start), and
        their pending and running builds and active Compose deployments are
        canceled. Containers, volumes, images and projects are kept;
        reactivation starts nothing. A container with an operation in
        progress, or a workload that could not be stopped, is counted in
        `workloads.remaining`. Repeating the request is safe and handles what
        remains. When Core cannot be reached the account is still
        deactivated and the answer is `503`.
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: User deactivated and their workloads stopped, or `workloads.remaining` still to stop
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDeactivation'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

