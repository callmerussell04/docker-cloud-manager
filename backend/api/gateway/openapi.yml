                $ref: '#/components/schemas/MessageResponse'


components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token obtained from /auth/login or /auth/refresh
    CookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token
    OIDCStateCookie:
      type: apiKey
      in: cookie
      name: oidc_state
    TelemetryTicketAuth:
      type: apiKey
      in: query
      name: ticket
      description: Short-lived, opaque, single-use ticket issued by the matching ticket endpoint.

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    FromParam:
      name: from
      in: query
      required: false
      description: Inclusive Unix timestamp; 0 lets the service choose the default range.
      schema:
        type: integer
        format: int64
        minimum: 0
    ToParam:
      name: to
      in: query
      required: false
      description: Inclusive Unix timestamp; 0 means the current service-defined upper bound.
      schema:
        type: integer
        format: int64
        minimum: 0
    LogTailParam:
      name: tail
      in: query
      required: false
      schema:
        type: integer
        default: 200
        minimum: 1
    LogSinceParam:
      name: since
      in: query
      required: false
      description: Unix timestamp or RFC3339 timestamp.
      schema:
        type: string
    LogTimestampsParam:
      name: timestamps
      in: query
      required: false
      schema:
        type: boolean
        default: true
    LogFollowParam:
      name: follow
      in: query
      required: false
      schema:
        type: boolean
        default: true
    TerminalCommandParam:
      name: cmd
      in: query
      required: false
      description: Allowed exec command. Defaults to the first configured shell.
      schema:
        type: string
    TerminalArgParam:
      name: arg
      in: query
      required: false
      description: Repeated command arguments.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    TerminalRowsParam:
      name: rows
      in: query
      required: false
      schema:
        type: integer
        default: 24
        minimum: 1
    TerminalColsParam:
      name: cols
      in: query
      required: false
      schema:
        type: integer
        default: 80
        minimum: 1
    TelemetryTicketParam:
      name: ticket
      in: query
      required: true
      description: Short-lived browser stream ticket from the matching ticket endpoint.
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized (Invalid or missing token)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden (Not enough permissions)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict (e.g. quota exceeded, resource in use)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Upstream dependency is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GatewayTimeout:
      description: Upstream request timed out
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        error_code:
          type: string
        request_id:
          type: string

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    TelemetryTicketResponse:
      type: object
      properties:
        ticket:
          type: string
          description: Opaque, short-lived, single-use browser stream ticket.
        expires_at:
          type: integer
          format: int64
          description: Unix timestamp when the ticket expires.

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          example: ok

    ReadinessStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum: [ok, unavailable]
              error:
                type: string

    # AUTH
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthProvidersResponse:
      type: object
      required: [local_login_enabled, local_register_enabled, oidc_providers]
      properties:
        local_login_enabled:
          type: boolean
        local_register_enabled:
          type: boolean
        oidc_providers:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
                example: keycloak

    # ADMIN USERS
    AdminUser:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, user]
        status:
          type: string
          enum: [active, deactivated]
        quota_cpu:
          type: number
          format: double
        quota_ram_mb:
          type: integer
          format: int64
        quota_disk_mb:
          type: integer
          format: int64

    PaginatedAdminUsers:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        total_count:
          type: integer

    CreateAdminUserRequest:
      type: object
      required: [username, email, password, role, status, quota_cpu, quota_ram_mb, quota_disk_mb]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        role:
          type: string
          enum: [admin, user]
        status:
          type: string
          enum: [active, deactivated]
        quota_cpu:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        quota_ram_mb:
          type: integer
          format: int64
          minimum: 1
        quota_disk_mb:
          type: integer
          format: int64
          minimum: 1

    UpdateAdminUserRequest:
      type: object
      required: [username, email, role, status, quota_cpu, quota_ram_mb, quota_disk_mb]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        role:
          type: string
          enum: [admin, user]
        status:
          type: string
          enum: [active, deactivated]
        quota_cpu:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        quota_ram_mb:
          type: integer
          format: int64
          minimum: 1
        quota_disk_mb:
          type: integer
          format: int64
          minimum: 1

    # CONTAINERS
    CreateContainerRequest:
      type: object
      required: [name, image_tag]
      properties:
        name:
          type: string
        image_tag:
          type: string
        internal_port:
          type: integer
        env_vars:
          type: object
          additionalProperties:
            type: string
        volume_mounts:
          type: array
          items:
            $ref: '#/components/schemas/VolumeMountRequest'
        domain_prefix:
          type: string
          maxLength: 30

    VolumeMountRequest:
      type: object
      required: [volume_id, mount_path]
      properties:
        volume_id:
          type: string
          format: uuid
        mount_path:
          type: string
        is_readonly:
          type: boolean
          default: false

    ExposeContainerRequest:
      type: object
      required: [domain_prefix, internal_port]
      properties:
        domain_prefix:
          type: string
          maxLength: 30
        internal_port:
          type: integer
          minimum: 1

    UserContainer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        image_tag:
          type: string
        internal_port:
          type: integer
        domain_prefix:
          type: string
        status:
          type: string
        desired_status:
          type: string
        last_error:
          type: string
        last_exit_code:
          type: integer
          nullable: true
        ttl_deadline:
          type: integer
          format: int64
          description: Unix timestamp when the current run expires; 0 means no active auto-stop deadline.
        created_at:
          type: integer
          format: int64
          description: Unix timestamp

    Container:
      type: object
      properties:
        id:
          type: string
          format: uuid
        docker_id:
          type: string
        project_id:
          type: string
          format: uuid
        name:
          type: string
        image_tag:
          type: string
        internal_port:
          type: integer
        domain_prefix:
          type: string
        status:
          type: string
        desired_status:
          type: string
        last_error:
          type: string
        last_exit_code:
          type: integer
          nullable: true
        ttl_deadline:
          type: integer
          format: int64
          description: Unix timestamp when the current run expires; 0 means no active auto-stop deadline.
        created_at:
          type: integer
          format: int64
          description: Unix timestamp
        owner_id:
          type: string
          format: uuid
        owner_username:
          type: string

    ContainerStats:
      type: object
      properties:
        cpu_percentage:
          type: number
          format: double
        memory_usage_bytes:
          type: integer
          format: int64
        memory_limit_bytes:
          type: integer
          format: int64
        network_rx_bytes:
          type: integer
          format: int64
        network_tx_bytes:
          type: integer
          format: int64

    # VOLUMES
    CreateVolumeRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    Volume:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        docker_name:
          type: string
        status:
          type: string
        last_error:
          type: string
        used_bytes:
          type: integer
          format: int64
        usage_observed_at:
          type: integer
          format: int64
        created_at:
          type: integer
          format: int64
        owner_id:
          type: string
          format: uuid
        owner_username:
          type: string

    UserVolume:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
        last_error:
          type: string
        used_bytes:
          type: integer
          format: int64
        usage_observed_at:
          type: integer
          format: int64
        created_at:
          type: integer
          format: int64

    # IMAGES
    UserImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tag:
          type: string
        size_mb:
          type: integer
        status:
          type: string
        last_error:
          type: string
        created_at:
          type: integer
          format: int64

    Image:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tag:
          type: string
        size_mb:
          type: integer
        status:
          type: string
        last_error:
          type: string
        created_at:
          type: integer
          format: int64
        owner_id:
          type: string
          format: uuid
        owner_username:
          type: string

    # BUILDS
    BuildImageGitRequest:
      type: object
      required: [repo_url, tag]
      properties:
        repo_url:
          type: string
          format: uri
          description: Public HTTPS repository URL without credentials.
        ref:
          type: string
        tag:
          type: string
        context:
          type: string
          default: .
        dockerfile:
          type: string
          default: Dockerfile
        build_args:
          type: object
          additionalProperties:
            type: string

    BuildAcceptedResponse:
      type: object
      required: [build_id, message]
      properties:
        build_id:
          type: string
          format: uuid
        message:
          type: string

    UserBuild:
      type: object
      properties:
        id:
          type: string
          format: uuid
        image_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        project_service_name:
          type: string
        status:
          type: string
        started_at:
          type: integer
          format: int64
        finished_at:
          type: integer
          format: int64

    Build:
      type: object
      properties:
        id:
          type: string
