openapi: 3.0.3
info:
  title: Docker Cloud Manager API
  description: Self-hosted PaaS API for managing Docker containers, volumes, images, builds, and compose projects.
  version: 1.0.0
servers:
  - url: /api/v1
    description: Gateway Service API

security:
  - BearerAuth: []

paths:
  /health/live:
    get:
      summary: Liveness probe
      tags: [Health]
      security: []
      servers:
        - url: /
      responses:
        '200':
          description: Gateway process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /health/ready:
    get:
      summary: Readiness probe
      tags: [Health]
      security: []
      servers:
        - url: /
      responses:
        '200':
          description: Gateway and upstream dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '503':
          description: One or more upstream dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'

  # ================= AUTH =================
  /auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/providers:
    get:
      summary: Get enabled authentication methods
      description: Rate limited in the session bucket with refresh and logout.
      tags: [Auth]
      security: []
      responses:
        '200':
          description: Local authentication flags and enabled OIDC providers. With OIDC off the provider list is empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProvidersResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/oidc/keycloak/start:
    get:
      summary: Start Keycloak authorization code flow
      description: >-
        A browser navigation. Answers 404 when OIDC is off; otherwise it only redirects. SSO stores a
        login attempt for 30 minutes and Gateway binds it to the browser with an HttpOnly cookie named
        `oidc_state_` plus the first 16 hex characters of the SHA-256 of the attempt's state (SameSite=Lax,
        path `/api/v1/auth/oidc/keycloak/callback`, Secure and domain as the refresh cookie, lifetime from the
        attempt's expiry), so attempts in several tabs keep separate cookies. Every failure redirects to the
        SPA callback page with `login=error&reason=<code>`: an invalid `redirect_after` to the default callback
        path with `login_failed`, a provider not yet reached or SSO unavailable to `redirect_after` with
        `provider_unavailable`, and a request over the sign-in navigation rate limit (shared with the callback)
        to the default callback path with `rate_limited`.
      tags: [Auth]
      security: []
      parameters:
        - name: redirect_after
          in: query
          required: false
          description: Allowed SPA callback URL or configured relative callback path.
          schema:
            type: string
      responses:
        '302':
          description: >-
            Redirect to the Keycloak authorization endpoint with the attempt's binding cookie set, or to the
            SPA callback page with `login=error&reason=<code>`.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            Location:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/oidc/keycloak/callback:
    get:
      summary: Complete Keycloak authorization code flow
      description: >-
        A browser navigation. Answers 404 when OIDC is off; otherwise it only redirects to the SPA callback
        page: `login=success` with the DCM refresh cookie set, or `login=error&reason=<code>`. Gateway reads
        the binding cookie named from the `state` parameter and clears it on every outcome; a state that is
        not 43 base64url characters is refused without sending the callback to SSO. A failure after SSO
        consumed the attempt redirects to the attempt's target, any other to the default callback path.
        Reasons (a closed set; clients show a generic message for a code they do not know):
        `access_denied` (the provider answered `error=access_denied`), `provider_error` (any other provider
        error), `state_invalid` (missing cookie, code or state, or an unknown, expired, mismatched or reused
        attempt), `identity_rejected`, `account_deactivated`, `account_conflict`, `provider_unavailable`
        (the provider not yet reached, or the provider or SSO unavailable or timing out), `rate_limited`
        (over the sign-in navigation limit shared with start) and `login_failed` (anything else).
      tags: [Auth]
      security:
        - OIDCStateCookie: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the SPA callback page with the sign-in result.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            Location:
              schema:
                type: string
            Set-Cookie:
              description: Clears the attempt's binding cookie; on success also sets the refresh cookie.
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/oidc/keycloak/backchannel-logout:
    post:
      summary: Receive a Keycloak back-channel logout
      description: >-
        OpenID Connect Back-Channel Logout, posted by Keycloak's server when a user signs out there or
        their Keycloak session is ended. Needs no cookie and no browser origin, reads a body of at most
        64 KiB, and has its own rate-limit bucket under `GATEWAY_AUTH_RATE_LIMIT_*`. SSO verifies the
        token's signature, issuer, audience and expiry, the back-channel logout event, a `sub` or `sid`,
        and the absence of a nonce. With `sid` it revokes the DCM sessions signed in with that Keycloak
        session; with only `sub` every session of that user signed in through Keycloak. A valid token
        that matches nothing, including the call Keycloak makes after a sign-out DCM started, still
        answers 200. A verified logout is audited as `auth.provider_logout`.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [logout_token]
              properties:
                logout_token:
                  type: string
                  description: The signed logout token (a JWT).
      responses:
        '200':
          description: The token is valid; the sessions it names are revoked.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/login:
    post:
      summary: Login to get access and refresh tokens
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          headers:
            Cache-Control:
              description: Credentials must not be cached
              schema:
                type: string
                enum: [no-store]
            Set-Cookie:
              description: Refresh token cookie (refresh_token)
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /auth/refresh:
    post:
      summary: Rotate the single-use refresh token
      description: >-
        Requires an allowed Origin header, or an allowed Referer origin when Origin is absent.
        Reusing a consumed token revokes its session, including access JWTs. Do not automatically
        retry an uncertain response. Invalid refresh returns 401 and expires the cookie;
        503/504 preserve it. Session absolute lifetime is 30 days and refresh idle lifetime is 7 days.
      parameters:
        - $ref: '#/components/parameters/CookieOrigin'
        - $ref: '#/components/parameters/CookieReferer'
      tags: [Auth]
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Token refreshed successfully
          headers:
            Cache-Control:
              description: Credentials must not be cached
              schema:
                type: string
                enum: [no-store]
            Set-Cookie:
              description: New refresh token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      summary: Revoke the current DCM session and clear its refresh cookie
      description: >-
        Accepts current or consumed refresh secrets, without an access JWT. Absent, unknown
        or already revoked secrets succeed idempotently. Other sessions remain active.
        Requires an allowed Origin or, if absent, an allowed Referer origin. Storage failure
        returns 503/504 and preserves the cookie; success confirms revocation. For a live session
        created through OIDC the answer carries `provider_logout_url`, the provider's sign-out URL
        (its end-session endpoint with `id_token_hint`, `client_id` and `post_logout_redirect_uri`
        set to the request origin plus `/login`); the client navigates to it after this call
        succeeds so the Keycloak session ends too. The URL holds Keycloak's own ID token, never a DCM
        token. Local sessions, already revoked ones, or a provider SSO has not reached or that
        advertises no end-session endpoint answer an empty object.
      parameters:
        - $ref: '#/components/parameters/CookieOrigin'
        - $ref: '#/components/parameters/CookieReferer'
      tags: [Auth]
      security: []
      responses:
        '200':
          description: Successfully logged out
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ================= CONTAINERS =================
  /containers:
    get:
      summary: Get all containers for current user
      tags: [Containers]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of containers
          content:
            application/json:
              schema:
                type: object
                properties:
                  containers:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserContainer'
                  total_count:
                    type: integer
                    format: int64
    post:
      summary: Create a new container
      tags: [Containers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContainerRequest'
      responses:
        '202':
          description: Container creation accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  container_id:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /containers/{id}:
    get:
      summary: Get one of the current user's containers
      tags: [Containers]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: The container
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContainer'
        '404':
          description: No such container, or it belongs to another user

  /containers/{id}/action/{action}:
    post:
      summary: Perform action on a container (start, stop, delete)
      tags: [Containers]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [start, stop, delete]
      responses:
        '202':
          description: Container lifecycle action accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /containers/{id}/expose:
    post:
      summary: Expose container to the internet via Traefik
      tags: [Containers]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExposeContainerRequest'
      responses:
        '202':
          description: Container expose operation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /containers/{id}/stats:
    get:
      summary: Get real-time container stats (CPU, RAM, Network)
      tags: [Containers]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Container stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerStats'

  /containers/{id}/logs/stream:
    get:
      summary: Stream container logs in real time
      tags: [Containers]
      security:
        - TelemetryTicketAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/LogTailParam'
        - $ref: '#/components/parameters/LogSinceParam'
        - $ref: '#/components/parameters/LogTimestampsParam'
        - $ref: '#/components/parameters/LogFollowParam'
        - $ref: '#/components/parameters/TelemetryTicketParam'
      responses:
        '200':
          description: Server-Sent Events stream with log, error, and end events
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /containers/{id}/logs/stream/ticket:
    post:
      summary: Issue a short-lived browser ticket for container logs
      tags: [Containers]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '201':
          description: Telemetry stream ticket issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryTicketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /containers/{id}/terminal:
    get:
      summary: Open an interactive terminal session for a running container
      tags: [Containers]
      security:
        - TelemetryTicketAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/TerminalCommandParam'
        - $ref: '#/components/parameters/TerminalArgParam'
        - $ref: '#/components/parameters/TerminalRowsParam'
        - $ref: '#/components/parameters/TerminalColsParam'
        - $ref: '#/components/parameters/TelemetryTicketParam'
      responses:
        '101':
          description: WebSocket upgrade accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /containers/{id}/terminal/ticket:
    post:
      summary: Issue a short-lived browser ticket for a container terminal
      tags: [Containers]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '201':
          description: Telemetry terminal ticket issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryTicketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ================= VOLUMES =================
  /volumes:
    get:
      summary: Get all volumes for current user
      tags: [Volumes]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of volumes
          content:
            application/json:
              schema:
                type: object
                properties:
                  volumes:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserVolume'
                  total_count:
                    type: integer
                    format: int64
    post:
      summary: Create a new volume
      tags: [Volumes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVolumeRequest'
      responses:
        '202':
          description: Volume creation accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  volume_id:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /volumes/{id}:
    delete:
      summary: Delete a volume
      tags: [Volumes]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '202':
          description: Volume deletion accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  # ================= IMAGES & BUILDER =================
  /images:
    get:
      summary: Get all images for current user
      tags: [Images]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of images
          content:
            application/json:
              schema:
                type: object
                properties:
                  images:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserImage'
                  total_count:
                    type: integer
                    format: int64

  /images/{id}:
    delete:
      summary: Delete an image
      tags: [Images]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '202':
          description: Image deletion accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /images/build:
    post:
      summary: Build a new image from source archive
      description: Multipart metadata fields (`tag`, optional `context`, `dockerfile`, `build_args`) must be sent before the `archive` file part. Non-file fields are limited to 1 MiB each.
      tags: [Images]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - tag
                - archive
              properties:
                tag:
                  type: string
                  description: "Image tag (e.g. my-app:v1)"
                context:
                  type: string
                  description: "Build context directory inside archive (default: .)"
                dockerfile:
                  type: string
                  description: "Dockerfile path inside context (default: Dockerfile)"
                build_args:
                  type: string
                  description: "JSON string of build arguments (e.g. {\"ENV\":\"prod\"})"
                archive:
                  type: string
                  format: binary
                  description: ".zip, .tar, or .tar.gz archive containing source code"
      responses:
        '202':
          description: Build job accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  build_id:
                    type: string
                    format: uuid
                  message:
                    type: string
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /images/build/git:
    post:
      summary: Build a new image from a public HTTPS Git repository
      tags: [Images]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildImageGitRequest'
      responses:
        '202':
          description: Build job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /images/build/availability:
    get:
      summary: Get image build availability
      tags: [Images]
      responses:
        '200':
          description: Current image build availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  message:
                    type: string
                  git_sources_enabled:
                    type: boolean
                  git_message:
                    type: string

  # ================= BUILDS =================
  /builds:
    get:
      summary: Get user builds history
      tags: [Builds]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of builds
          content:
            application/json:
              schema:
                type: object
                properties:
                  builds:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserBuild'
                  total_count:
                    type: integer
                    format: int64

  /builds/{id}:
    delete:
      summary: Delete a build record
      tags: [Builds]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Build record deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /builds/{id}/logs:
    get:
      summary: Get logs for a specific build
      tags: [Builds]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Plain text logs stream
          content:
            text/plain:
              schema:
                type: string

  /builds/{id}/cancel:
    post:
      summary: Cancel a queued or running build
      tags: [Builds]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Build cancellation requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ================= PROJECTS (COMPOSE) =================
  /projects:
    get:
      summary: Get all compose projects for current user
      tags: [Projects]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserProject'
                  total_count:
                    type: integer
                    format: int64

  /projects/compose:
    post:
      summary: Deploy a new Docker Compose project
      tags: [Projects]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - project_name
                - archive
              properties:
                project_name:
                  type: string
                  description: "Name of the compose project"
                compose_file:
                  type: string
                  description: "Optional relative path to docker-compose.yml inside archive, for example deploy/docker-compose.yml"
                archive:
                  type: string
                  format: binary
                  description: ".zip, .tar, .tar.gz, .tgz archive containing a Compose file and sources, or raw .yml/.yaml without builds"
      responses:
        '202':
          description: Compose deployment accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id:
                    type: string
                    format: uuid
                  message:
                    type: string

  /projects/compose/git:
    post:
      summary: Deploy a Docker Compose project from a public HTTPS Git repository
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployComposeGitRequest'
      responses:
        '202':
          description: Compose deployment accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComposeAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
