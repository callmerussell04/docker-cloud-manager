openapi: 3.0.3
info:
  title: Docker Cloud Manager API
  description: Self-hosted PaaS API for managing Docker containers, volumes, images, builds, and compose projects.
  version: 1.0.0
servers:
  - url: /api/v1
    description: Gateway Service API

security:
  - BearerAuth: []

paths:
  /health/live:
    get:
      summary: Liveness probe
      tags: [Health]
      security: []
      servers:
        - url: /
      responses:
        '200':
          description: Gateway process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /health/ready:
    get:
      summary: Readiness probe
      tags: [Health]
      security: []
      servers:
        - url: /
      responses:
        '200':
          description: Gateway and upstream dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '503':
          description: One or more upstream dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'

  # ================= AUTH =================
  /auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/providers:
    get:
      summary: Get enabled authentication methods
      tags: [Auth]
      security: []
      responses:
        '200':
          description: Local authentication flags and configured OIDC providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProvidersResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/oidc/keycloak/start:
    get:
      summary: Start Keycloak authorization code flow
      tags: [Auth]
      security: []
      parameters:
        - name: redirect_after
          in: query
          required: false
          description: Allowed SPA callback URL or configured relative callback path.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the Keycloak authorization endpoint and set the HttpOnly oidc_state cookie
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/oidc/keycloak/callback:
    get:
      summary: Complete Keycloak authorization code flow
      tags: [Auth]
      security:
        - OIDCStateCookie: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Set the DCM refresh cookie and redirect to the SPA callback
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/login:
    post:
      summary: Login to get access and refresh tokens
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          headers:
            Set-Cookie:
              description: Refresh token cookie (refresh_token)
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      summary: Refresh access token using cookie
      tags: [Auth]
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Token refreshed successfully
          headers:
            Set-Cookie:
              description: New refresh token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      summary: Logout user (clears refresh token cookie)
      tags: [Auth]
      security: []
      responses:
        '200':
          description: Successfully logged out

  # ================= CONTAINERS =================
  /containers:
    get:
      summary: Get all containers for current user
      tags: [Containers]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of containers
          content:
            application/json:
              schema:
                type: object
                properties:
                  containers:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserContainer'
                  total_count:
                    type: integer
                    format: int64
    post:
      summary: Create a new container
      tags: [Containers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContainerRequest'
      responses:
        '202':
          description: Container creation accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  container_id:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /containers/{id}/action/{action}:
    post:
      summary: Perform action on a container (start, stop, delete)
      tags: [Containers]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [start, stop, delete]
      responses:
        '202':
          description: Container lifecycle action accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /containers/{id}/expose:
    post:
      summary: Expose container to the internet via Traefik
      tags: [Containers]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExposeContainerRequest'
      responses:
        '202':
          description: Container expose operation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /containers/{id}/stats:
    get:
      summary: Get real-time container stats (CPU, RAM, Network)
      tags: [Containers]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Container stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerStats'

  /containers/{id}/logs/stream:
    get:
      summary: Stream container logs in real time
      tags: [Containers]
      security:
        - TelemetryTicketAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/LogTailParam'
        - $ref: '#/components/parameters/LogSinceParam'
        - $ref: '#/components/parameters/LogTimestampsParam'
        - $ref: '#/components/parameters/LogFollowParam'
        - $ref: '#/components/parameters/TelemetryTicketParam'
      responses:
        '200':
          description: Server-Sent Events stream with log, error, and end events
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /containers/{id}/logs/stream/ticket:
    post:
      summary: Issue a short-lived browser ticket for container logs
      tags: [Containers]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '201':
          description: Telemetry stream ticket issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryTicketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /containers/{id}/terminal:
    get:
      summary: Open an interactive terminal session for a running container
      tags: [Containers]
      security:
        - TelemetryTicketAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/TerminalCommandParam'
        - $ref: '#/components/parameters/TerminalArgParam'
        - $ref: '#/components/parameters/TerminalRowsParam'
        - $ref: '#/components/parameters/TerminalColsParam'
        - $ref: '#/components/parameters/TelemetryTicketParam'
      responses:
        '101':
          description: WebSocket upgrade accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /containers/{id}/terminal/ticket:
    post:
      summary: Issue a short-lived browser ticket for a container terminal
      tags: [Containers]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '201':
          description: Telemetry terminal ticket issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryTicketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ================= VOLUMES =================
  /volumes:
    get:
      summary: Get all volumes for current user
      tags: [Volumes]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of volumes
          content:
            application/json:
              schema:
                type: object
                properties:
                  volumes:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserVolume'
                  total_count:
                    type: integer
                    format: int64
    post:
      summary: Create a new volume
      tags: [Volumes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVolumeRequest'
      responses:
        '202':
          description: Volume creation accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  volume_id:
                    type: string
                    format: uuid
        '409':
          $ref: '#/components/responses/Conflict'

  /volumes/{id}:
    delete:
      summary: Delete a volume
      tags: [Volumes]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '202':
          description: Volume deletion accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  # ================= IMAGES & BUILDER =================
  /images:
    get:
      summary: Get all images for current user
      tags: [Images]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of images
          content:
            application/json:
              schema:
                type: object
                properties:
                  images:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserImage'
                  total_count:
                    type: integer
                    format: int64

  /images/{id}:
    delete:
      summary: Delete an image
      tags: [Images]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '202':
          description: Image deletion accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /images/build:
    post:
      summary: Build a new image from source archive
      description: Multipart metadata fields (`tag`, optional `context`, `dockerfile`, `build_args`) must be sent before the `archive` file part. Non-file fields are limited to 1 MiB each.
      tags: [Images]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - tag
                - archive
              properties:
                tag:
                  type: string
                  description: "Image tag (e.g. my-app:v1)"
                context:
                  type: string
                  description: "Build context directory inside archive (default: .)"
                dockerfile:
                  type: string
                  description: "Dockerfile path inside context (default: Dockerfile)"
                build_args:
                  type: string
                  description: "JSON string of build arguments (e.g. {\"ENV\":\"prod\"})"
                archive:
                  type: string
                  format: binary
                  description: ".zip, .tar, or .tar.gz archive containing source code"
      responses:
        '202':
          description: Build job accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  build_id:
                    type: string
                    format: uuid
                  message:
                    type: string
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /images/build/git:
    post:
      summary: Build a new image from a public HTTPS Git repository
      tags: [Images]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildImageGitRequest'
      responses:
        '202':
          description: Build job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /images/build/availability:
    get:
      summary: Get image build availability
      tags: [Images]
      responses:
        '200':
          description: Current image build availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  message:
                    type: string
                  git_sources_enabled:
                    type: boolean
                  git_message:
                    type: string

  # ================= BUILDS =================
  /builds:
    get:
      summary: Get user builds history
      tags: [Builds]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of builds
          content:
            application/json:
              schema:
                type: object
                properties:
                  builds:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserBuild'
                  total_count:
                    type: integer
                    format: int64

  /builds/{id}:
    delete:
      summary: Delete a build record
      tags: [Builds]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Build record deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /builds/{id}/logs:
    get:
      summary: Get logs for a specific build
      tags: [Builds]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Plain text logs stream
          content:
            text/plain:
              schema:
                type: string

  /builds/{id}/cancel:
    post:
      summary: Cancel a queued or running build
      tags: [Builds]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Build cancellation requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ================= PROJECTS (COMPOSE) =================
  /projects:
    get:
      summary: Get all compose projects for current user
      tags: [Projects]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserProject'
                  total_count:
                    type: integer
                    format: int64

  /projects/compose:
    post:
      summary: Deploy a new Docker Compose project
      tags: [Projects]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - project_name
                - archive
              properties:
                project_name:
                  type: string
                  description: "Name of the compose project"
                compose_file:
                  type: string
                  description: "Optional relative path to docker-compose.yml inside archive, for example deploy/docker-compose.yml"
                archive:
                  type: string
                  format: binary
                  description: ".zip, .tar, .tar.gz, .tgz archive containing a Compose file and sources, or raw .yml/.yaml without builds"
      responses:
        '202':
          description: Compose deployment accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id:
                    type: string
                    format: uuid
                  message:
                    type: string

  /projects/compose/git:
    post:
      summary: Deploy a Docker Compose project from a public HTTPS Git repository
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployComposeGitRequest'
      responses:
        '202':
          description: Compose deployment accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComposeAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /projects/{id}:
    delete:
      summary: Delete a compose project and its resources
      tags: [Projects]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '202':
          description: Project deletion accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /projects/{id}/start:
    post:
      summary: Start all containers in a compose project
      tags: [Projects]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '202':
          description: Project start accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /projects/{id}/stop:
    post:
      summary: Stop all containers in a compose project
      tags: [Projects]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '202':
          description: Project stop accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /projects/{id}/cancel:
    post:
      summary: Cancel an active compose deployment
      tags: [Projects]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '202':
          description: Project cancellation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  # ================= STATS =================
  /stats:
    get:
      summary: Get usage statistics for current user
      tags: [Stats]
      responses:
        '200':
          description: User statistics and quotas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStats'

  # ================= ADMIN =================
  /admin/config:
    get:
      summary: Get system runtime configuration
      tags: [Admin]
      responses:
        '200':
          description: System configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfig'
    put:
      summary: Update system runtime configuration dynamically
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemConfig'
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /admin/monitoring:
    get:
      summary: Get live host capacity and managed resource monitoring
      tags: [Admin]
      responses:
        '200':
          description: Current host and DCM monitoring snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMonitoring'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/reports/overview:
    get:
      summary: Get reports overview for a time range
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
      responses:
        '200':
          description: Reports overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportsOverview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/reports/users:
    get:
      summary: Get paginated user usage report
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: sort
          in: query
          schema:
            type: string
            default: disk
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated user usage report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUsageReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/reports/users/{id}/usage:
    get:
      summary: Get a user's usage timeline
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
      responses:
        '200':
          description: Usage timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUsageTimeline'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/reports/audit-events:
    get:
      summary: Get paginated audit events
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: actor_user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            type: string
        - name: resource_type
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/reports/usage-snapshots/refresh:
    post:
      summary: Request an out-of-cycle usage snapshot collection
      tags: [Admin]
      responses:
        '202':
          description: Snapshot refresh accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshUsageSnapshotsResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/users:
    get:
      summary: Get paginated list of users
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUsers'
    post:
      summary: Create a user as admin
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
