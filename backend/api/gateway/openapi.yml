        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/containers/{id}/terminal/ticket:
    post:
      summary: Admin issue a short-lived browser ticket for any container terminal
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '201':
          description: Telemetry terminal ticket issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryTicketResponse'
        '400':
