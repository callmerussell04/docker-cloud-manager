syntax = "proto3";

package sso;

option go_package = "github.com/callmerussell04/docker-cloud-manager/backend/api/sso;sso";

service Auth {
  rpc Register (RegisterRequest) returns (RegisterResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc Refresh (RefreshRequest) returns (RefreshResponse);
  rpc Logout (LogoutRequest) returns (LogoutResponse);
  rpc GetAuthConfig (GetAuthConfigRequest) returns (GetAuthConfigResponse);
  rpc StartOIDCLogin (StartOIDCLoginRequest) returns (StartOIDCLoginResponse);
  rpc CompleteOIDCCallback (CompleteOIDCCallbackRequest) returns (CompleteOIDCCallbackResponse);
}

service UserAPI {
  rpc VerifyAccessToken (VerifyTokenRequest) returns (UserData);
  rpc CheckPermission (CheckPermissionRequest) returns (CheckPermissionResponse);
  rpc GetUser (GetUserRequest) returns (UserData);
  rpc BatchGetUsers (BatchGetUsersRequest) returns (BatchGetUsersResponse);
  rpc ListUsers (ListUsersRequest) returns (ListUsersResponse);
  rpc CreateUser (CreateUserRequest) returns (UserData);
  rpc UpdateUser (UpdateUserRequest) returns (UserData);
  rpc DeactivateUser (UserIDRequest) returns (UserData);
  rpc ReactivateUser (UserIDRequest) returns (UserData);
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

message RegisterResponse {
  string user_id = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 refresh_expires_at = 3;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 refresh_expires_at = 3;
}

message GetAuthConfigRequest {}

message OIDCProviderData {
  string name = 1;
  // available is false while SSO has not reached the provider; sign-in through it answers unavailable.
  bool available = 2;
}

message GetAuthConfigResponse {
  bool local_login_enabled = 1;
  bool local_register_enabled = 2;
  repeated OIDCProviderData oidc_providers = 3;
}

message StartOIDCLoginRequest {
  string provider = 1;
  string redirect_after = 2;
}

message StartOIDCLoginResponse {
  string auth_url = 1;
  // state_binding is the secret Gateway keeps in the attempt's browser cookie.
  string state_binding = 2;
  // state names the attempt; Gateway derives the cookie name from it.
  string state = 3;
  // expires_at (Unix seconds) is when the attempt expires; Gateway sets the cookie lifetime from it.
  int64 expires_at = 4;
}

message CompleteOIDCCallbackRequest {
  string provider = 1;
  string code = 2;
  string state = 3;
  string state_binding = 4;
}

// OIDCCallbackOutcome is how a callback ended when it ended as expected.
// Provider or SSO unavailability and timeouts are gRPC errors instead.
enum OIDCCallbackOutcome {
  OIDC_CALLBACK_OUTCOME_UNSPECIFIED = 0;
  OIDC_CALLBACK_OUTCOME_SUCCESS = 1;
  // The attempt is unknown, expired, already used, or bound to another browser.
  OIDC_CALLBACK_OUTCOME_INVALID_ATTEMPT = 2;
  OIDC_CALLBACK_OUTCOME_IDENTITY_REJECTED = 3;
  OIDC_CALLBACK_OUTCOME_ACCOUNT_DEACTIVATED = 4;
  OIDC_CALLBACK_OUTCOME_ACCOUNT_CONFLICT = 5;
}

message CompleteOIDCCallbackResponse {
  // Tokens are set only with OIDC_CALLBACK_OUTCOME_SUCCESS.
  string access_token = 1;
  string refresh_token = 2;
  // redirect_after is the attempt's target once the attempt was consumed, and empty before.
  string redirect_after = 3;
  int64 refresh_expires_at = 4;
  OIDCCallbackOutcome outcome = 5;
}

message VerifyTokenRequest {
  string access_token = 1;
}

message CheckPermissionRequest {
  string access_token = 1;
  string permission = 2;
}

message CheckPermissionResponse {
  bool allowed = 1;
  UserData user = 2;
}

message GetUserRequest {
  string user_id = 1;
}

message UserIDRequest {
  string user_id = 1;
}

message BatchGetUsersRequest {
  repeated string user_ids = 1;
}

message UserData {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string role = 4;
  string status = 8;
  // Quotas moved to Core (ADR 0005); do not reuse.
  reserved 5, 6, 7;
  reserved "quota_ram_mb", "quota_disk_mb", "quota_cpu";
}

message BatchGetUsersResponse {
  repeated UserData users = 1;
}

message ListUsersRequest {
  int32 page = 1;
  int32 limit = 2;
}

message ListUsersResponse {
  repeated UserData users = 1;
  int32 total_count = 2;
}

message CreateUserRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string role = 4;
  string status = 5;
  // Quotas moved to Core (ADR 0005); do not reuse.
  reserved 6, 7, 8;
  reserved "quota_cpu", "quota_ram_mb", "quota_disk_mb";
}

message UpdateUserRequest {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string password = 4;
  string role = 5;
  string status = 6;
  // Quotas moved to Core (ADR 0005); do not reuse.
  reserved 7, 8, 9;
  reserved "quota_cpu", "quota_ram_mb", "quota_disk_mb";
}
