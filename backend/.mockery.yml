with-expecter: true
case: underscore
exported: true
keeptree: true
outpkg: coremocks
issue-845-fix: true
packages:
  github.com/callmerussell04/docker-cloud-manager/internal/core/service:
    config:
      recursive: true
      all: true
      dir: tests/mocks/core/service
      outpkg: coremocks
      mockname: "{{.InterfaceName | camelcase}}"
      filename: "{{.InterfaceName | snakecase}}.go"
  github.com/callmerussell04/docker-cloud-manager/internal/core/http:
    config:
      all: true
      dir: tests/mocks/core/http
      outpkg: corehttpmocks
  github.com/callmerussell04/docker-cloud-manager/internal/core/grpc:
    config:
      all: true
      dir: tests/mocks/core/grpc
      outpkg: coregrpcmocks
  github.com/callmerussell04/docker-cloud-manager/internal/sso/service:
    config:
      all: true
      dir: tests/mocks/sso/service
      outpkg: ssomocks
      mockname: "{{.InterfaceName}}"
  github.com/callmerussell04/docker-cloud-manager/internal/sso/grpc:
    config:
      all: true
      dir: tests/mocks/sso/grpc
      outpkg: ssogrpcmocks
