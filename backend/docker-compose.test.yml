services:
  core_test_db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dcm_core_test
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dcm_core_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  sso_test_db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dcm_sso_test
    ports:
      - "127.0.0.1:15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dcm_sso_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  clickhouse_test:
    image: clickhouse/clickhouse-server:25.5
    environment:
      CLICKHOUSE_DB: dcm_reports_test
      CLICKHOUSE_PASSWORD: clickhouse
    ports:
      - "127.0.0.1:19002:9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --host localhost --password clickhouse --query 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 30

  rabbitmq_test:
    image: rabbitmq:4-management
    ports:
      - "127.0.0.1:15692:5672"
      - "127.0.0.1:15693:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio_test:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30
