x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: &default-logging
    driver: json-file
    options:
      max-size: "${COMPOSE_LOG_MAX_SIZE:-10m}"
      max-file: "${COMPOSE_LOG_MAX_FILE:-3}"

x-one-shot-defaults: &one-shot-defaults
  restart: "no"
  logging: *default-logging

x-backend-build: &backend-build
  context: ./backend

x-postgres-env: &postgres-env
  POSTGRES_USER: "${POSTGRES_USER:-postgres}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"

x-rabbitmq-url-env: &rabbitmq-url-env
  RABBITMQ_URL: "amqp://${RABBITMQ_USER:-dcm}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/"

x-object-storage-env: &object-storage-env
  OBJECT_STORAGE_ENDPOINT: "${OBJECT_STORAGE_ENDPOINT:-minio:9000}"
  OBJECT_STORAGE_BUCKET: "${OBJECT_STORAGE_BUCKET:-dcm-builds}"
  OBJECT_STORAGE_ACCESS_KEY: "${OBJECT_STORAGE_ACCESS_KEY:-${MINIO_ROOT_USER:-dcm_minio}}"
  OBJECT_STORAGE_SECRET_KEY: "${OBJECT_STORAGE_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}}"
  OBJECT_STORAGE_USE_SSL: "${OBJECT_STORAGE_USE_SSL:-false}"

x-build-runtime-env: &build-runtime-env
  BUILD_NETWORK_NAME: "${BUILD_NETWORK_NAME:-build_net}"
  BUILD_MEMORY_BYTES: "${BUILD_MEMORY_BYTES:-2147483648}"
  BUILD_CPU_MILLICORES: "${BUILD_CPU_MILLICORES:-2000}"
  BUILD_CPU_PERIOD: "${BUILD_CPU_PERIOD:-100000}"
  BUILD_MEMORY_SWAP_MULTIPLIER: "${BUILD_MEMORY_SWAP_MULTIPLIER:-2}"
  BUILD_PIDS_LIMIT: "${BUILD_PIDS_LIMIT:-512}"
  KANIKO_IMAGE: "${KANIKO_IMAGE:-gcr.io/kaniko-project/executor@sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698}"
  MAX_BUILD_TIME_MINUTES: "${MAX_BUILD_TIME_MINUTES:-10}"
  MAX_CONCURRENT_BUILDS: "${MAX_CONCURRENT_BUILDS:-2}"
  MAX_ARCHIVE_SIZE_BYTES: "${MAX_ARCHIVE_SIZE_BYTES:-52428800}"
  MAX_UNPACKED_SIZE_BYTES: "${MAX_UNPACKED_SIZE_BYTES:-524288000}"
  MAX_BUILD_LOG_SIZE_BYTES: "${MAX_BUILD_LOG_SIZE_BYTES:-5242880}"
  BUILD_CANCEL_POLL_INTERVAL_SECONDS: "${BUILD_CANCEL_POLL_INTERVAL_SECONDS:-2}"
  BUILD_MAX_DISK_BYTES: "${BUILD_MAX_DISK_BYTES:-10737418240}"

x-traefik-common-labels: &traefik-common-labels
  traefik.enable: "true"
  traefik.docker.network: "proxy_net"

x-traefik-security-headers: &traefik-security-headers
  traefik.http.middlewares.dcm-security-headers.headers.contenttypenosniff: "true"
  traefik.http.middlewares.dcm-security-headers.headers.framedeny: "true"
  traefik.http.middlewares.dcm-security-headers.headers.referrerpolicy: "same-origin"

services:
  core_db:
    <<: *service-defaults
    image: postgres:17.10-alpine3.23
    environment:
      <<: *postgres-env
      POSTGRES_DB: "${CORE_POSTGRES_DB:-dcm_core_db}"
    volumes:
      - core_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dcm_net

  sso_db:
    <<: *service-defaults
    image: postgres:17.10-alpine3.23
    environment:
      <<: *postgres-env
      POSTGRES_DB: "${SSO_POSTGRES_DB:-dcm_sso_db}"
    volumes:
      - sso_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dcm_net

  migrate_core:
    <<: *one-shot-defaults
    image: migrate/migrate:v4.19.1
    depends_on:
      core_db:
        condition: service_healthy
    volumes:
      - ./backend/migrations/core:/migrations
    command: ["-path", "/migrations", "-database", "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@core_db:5432/${CORE_POSTGRES_DB:-dcm_core_db}?sslmode=disable", "up"]
    networks:
      - dcm_net

  migrate_sso:
    <<: *one-shot-defaults
    image: migrate/migrate:v4.19.1
    depends_on:
      sso_db:
        condition: service_healthy
    volumes:
      - ./backend/migrations/sso:/migrations
    command: ["-path", "/migrations", "-database", "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@sso_db:5432/${SSO_POSTGRES_DB:-dcm_sso_db}?sslmode=disable", "up"]
    networks:
      - dcm_net

  clickhouse:
    <<: *service-defaults
    image: clickhouse/clickhouse-server:25.5.11.15
    environment:
      CLICKHOUSE_DB: "${CLICKHOUSE_DB:-dcm_reports}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-dcm_reports}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --host localhost --user $${CLICKHOUSE_USER} --password $${CLICKHOUSE_PASSWORD} --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dcm_net

  migrate_reports:
    <<: *one-shot-defaults
    image: migrate/migrate:v4.19.1
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./backend/migrations/reports:/migrations
    command: ["-path", "/migrations", "-database", "clickhouse://clickhouse:9000?username=${CLICKHOUSE_USER:-dcm_reports}&password=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}&database=${CLICKHOUSE_DB:-dcm_reports}&x-migrations-table-engine=MergeTree", "up"]
    networks:
      - dcm_net

  rabbitmq:
    <<: *service-defaults
    image: rabbitmq:4.3.1-management
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-dcm}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dcm_net

  minio:
    <<: *service-defaults
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-dcm_minio}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dcm_net

  traefik:
    <<: *service-defaults
    image: traefik:v3.6.20
    container_name: dcm_traefik
    user: root
    command:
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy_net"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.forwardedheaders.insecure=false"
      - "--api.dashboard=${TRAEFIK_DASHBOARD_ENABLED:-false}"
      - "--api.insecure=${TRAEFIK_DASHBOARD_ENABLED:-false}"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
      # Future HTTPS/ACME wiring can be added here with websecure and certificatesResolvers.
    ports:
      - "80:80"
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      # build-network-policy accepts same-bridge proxy_net traffic only to or
      # from this address, so exposed containers reach each other only via Traefik.
      proxy_net:
        ipv4_address: "${TRAEFIK_PROXY_IP:-172.30.240.2}"
      dcm_net: {}
      gateway_ingress:
        ipv4_address: "${TRAEFIK_GATEWAY_IP:-172.30.251.2}"

  build-network-policy:
    build:
      context: .
      dockerfile: deployment/registry/network-policy.Dockerfile
    network_mode: host
    cap_add: [NET_ADMIN]
    read_only: true
    tmpfs: [/run]
    environment:
      PROXY_BRIDGE: "${PROXY_BRIDGE_NAME:-br-dcm-proxy}"
      TRAEFIK_PROXY_IP: "${TRAEFIK_PROXY_IP:-172.30.240.2}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "/usr/local/bin/network-policy-check"]
      interval: 2s
      timeout: 1s
      retries: 10

  build-egress:
    build:
      context: .
      dockerfile: deployment/registry/egress.Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /var/run/squid, /var/cache/squid]
    networks:
      build_net:
        ipv4_address: 172.30.252.3
      build_egress_net: {}

  registry-edge:
    build:
      context: .
      dockerfile: deployment/registry/edge.Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      # Docker publishes no ports for a container on internal networks only.
      registry_publish_net: {}
      registry_front_net: {}
      build_net:
        ipv4_address: 172.30.252.2
        aliases: [registry]
    depends_on:
      core:
        condition: service_started

  registry:
    <<: *service-defaults
    image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    container_name: registry
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HTTP_TLS_CERTIFICATE: /run/dcm-registry/backend.crt
      REGISTRY_HTTP_TLS_KEY: /run/dcm-registry/backend.key
      REGISTRY_HTTP_SECRET: "${REGISTRY_HTTP_SECRET:?REGISTRY_HTTP_SECRET is required}"
      REGISTRY_HTTP_HOST: "https://${REGISTRY_URL:-registry:5000}"
      REGISTRY_AUTH: token
      REGISTRY_AUTH_TOKEN_REALM: "https://${REGISTRY_URL:-registry:5000}/token"
      REGISTRY_AUTH_TOKEN_SERVICE: dcm-registry
      REGISTRY_AUTH_TOKEN_ISSUER: "${REGISTRY_TOKEN_ISSUER:-dcm-core}"
      REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE: /run/dcm-registry/signing.crt
    volumes:
      - registry_data:/var/lib/registry
      - ${REGISTRY_CERTS_DIR:?REGISTRY_CERTS_DIR is required}/backend.crt:/run/dcm-registry/backend.crt:ro
      - ${REGISTRY_CERTS_DIR:?REGISTRY_CERTS_DIR is required}/backend.key:/run/dcm-registry/backend.key:ro
      - ${REGISTRY_CERTS_DIR:?REGISTRY_CERTS_DIR is required}/signing.crt:/run/dcm-registry/signing.crt:ro
    networks:
      registry_net:
        aliases: [registry-backend]

  sso:
    <<: *service-defaults
    build:
      <<: *backend-build
      dockerfile: dockerfiles/sso.Dockerfile
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@sso_db:5432/${SSO_POSTGRES_DB:-dcm_sso_db}?sslmode=disable"
      SSO_DB_MAX_OPEN: "${SSO_DB_MAX_OPEN:-20}"
      SSO_DB_MAX_LIFETIME: "${SSO_DB_MAX_LIFETIME:-30m}"
      SSO_DB_MAX_IDLE_TIME: "${SSO_DB_MAX_IDLE_TIME:-5m}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      GATEWAY_SERVICE_TOKEN: "${GATEWAY_SERVICE_TOKEN:?GATEWAY_SERVICE_TOKEN is required}"
      CORE_SERVICE_TOKEN: "${CORE_SERVICE_TOKEN:?CORE_SERVICE_TOKEN is required}"
      SSO_ADMIN_USERNAME: "${SSO_ADMIN_USERNAME:-admin}"
      SSO_ADMIN_EMAIL: "${SSO_ADMIN_EMAIL:-admin@example.local}"
      SSO_ADMIN_PASSWORD: "${SSO_ADMIN_PASSWORD:?SSO_ADMIN_PASSWORD is required}"
      SSO_LOCAL_LOGIN_ENABLED: "${SSO_LOCAL_LOGIN_ENABLED:-true}"
      SSO_LOCAL_REGISTER_ENABLED: "${SSO_LOCAL_REGISTER_ENABLED:-true}"
      SSO_OIDC_ENABLED: "${SSO_OIDC_ENABLED:-false}"
      SSO_OIDC_ISSUER_URL: "${SSO_OIDC_ISSUER_URL:-}"
      SSO_OIDC_CLIENT_ID: "${SSO_OIDC_CLIENT_ID:-}"
      SSO_OIDC_CLIENT_SECRET: "${SSO_OIDC_CLIENT_SECRET:-}"
      SSO_OIDC_REDIRECT_URL: "${SSO_OIDC_REDIRECT_URL:-}"
      SSO_OIDC_ADMIN_GROUPS: "${SSO_OIDC_ADMIN_GROUPS:-}"
      SSO_GRPC_PORT: "50051"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "keycloak.localhost:host-gateway"
    networks:
      - dcm_net
    depends_on:
      migrate_sso:
        condition: service_completed_successfully

  core:
    <<: *service-defaults
    build:
      <<: *backend-build
      dockerfile: dockerfiles/core.Dockerfile
    environment:
      <<: [*rabbitmq-url-env, *object-storage-env, *build-runtime-env]
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@core_db:5432/${CORE_POSTGRES_DB:-dcm_core_db}?sslmode=disable"
      CORE_DB_MAX_OPEN: "${CORE_DB_MAX_OPEN:-20}"
      CORE_DB_MAX_LIFETIME: "${CORE_DB_MAX_LIFETIME:-30m}"
      CORE_DB_MAX_IDLE_TIME: "${CORE_DB_MAX_IDLE_TIME:-5m}"
      CORE_SERVICE_TOKEN: "${CORE_SERVICE_TOKEN:?CORE_SERVICE_TOKEN is required}"
      GATEWAY_SERVICE_TOKEN: "${GATEWAY_SERVICE_TOKEN:?GATEWAY_SERVICE_TOKEN is required}"
      BUILDER_SERVICE_TOKEN: "${BUILDER_SERVICE_TOKEN:?BUILDER_SERVICE_TOKEN is required}"
      SSO_GRPC_TARGET: "sso:50051"
      BASE_DOMAIN: "${BASE_DOMAIN:-localhost}"
      IMAGE_BUILDS_ENABLED: "${IMAGE_BUILDS_ENABLED:-true}"
      CLICKHOUSE_ADDR: "clickhouse:9000"
      CLICKHOUSE_DB: "${CLICKHOUSE_DB:-dcm_reports}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-dcm_reports}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}"
      REGISTRY_API_URL: "${REGISTRY_API_URL:-https://registry-backend:5000}"
      REGISTRY_URL: "${REGISTRY_URL:-registry:5000}"
      REGISTRY_BACKEND_URL: "https://registry-backend:5000"
      REGISTRY_CA_FILE: /run/dcm-registry/ca.crt
      REGISTRY_TLS_CERT_FILE: /run/dcm-registry/registry.crt
      REGISTRY_TLS_KEY_FILE: /run/dcm-registry/registry.key
      REGISTRY_SIGNING_CERT_FILE: /run/dcm-registry/signing.crt
      REGISTRY_SIGNING_KEY_FILE: /run/dcm-registry/signing.key
      REGISTRY_TOKEN_ISSUER: "${REGISTRY_TOKEN_ISSUER:-dcm-core}"
      REGISTRY_PUBLIC_URL: "${REGISTRY_PUBLIC_URL:-registry:5000}"
      REGISTRY_CONTAINER_NAME: "${REGISTRY_CONTAINER_NAME:-registry}"
      CONTAINER_PIDS_LIMIT: "${CONTAINER_PIDS_LIMIT:-256}"
      CONTAINER_MEMORY_SWAP_MULTIPLIER: "${CONTAINER_MEMORY_SWAP_MULTIPLIER:-2}"
      PROXY_NETWORK_NAME: "${PROXY_NETWORK_NAME:-proxy_net}"
      TTL_WORKER_INTERVAL_SECONDS: "${TTL_WORKER_INTERVAL_SECONDS:-60}"
      GC_WORKER_INTERVAL_MINUTES: "${GC_WORKER_INTERVAL_MINUTES:-60}"
      STALE_BUILD_TIMEOUT_MINUTES: "${STALE_BUILD_TIMEOUT_MINUTES:-30}"
      EVENT_SYNC_INTERVAL_SECONDS: "${EVENT_SYNC_INTERVAL_SECONDS:-30}"
      EVENT_RECONNECT_DELAY_SECONDS: "${EVENT_RECONNECT_DELAY_SECONDS:-5}"
      VOLUME_USAGE_INTERVAL_SECONDS: "${VOLUME_USAGE_INTERVAL_SECONDS:-60}"
      VOLUME_USAGE_CYCLE_BUDGET_SECONDS: "${VOLUME_USAGE_CYCLE_BUDGET_SECONDS:-15}"
      VOLUME_USAGE_SCAN_ENTRY_BUDGET: "${VOLUME_USAGE_SCAN_ENTRY_BUDGET:-50000}"
      REGISTRY_CLEANUP_INTERVAL_SECONDS: "${REGISTRY_CLEANUP_INTERVAL_SECONDS:-5}"
      REGISTRY_CLEANUP_JOB_TIMEOUT_SECONDS: "${REGISTRY_CLEANUP_JOB_TIMEOUT_SECONDS:-20}"
      REGISTRY_GC_MAX_DURATION_SECONDS: "${REGISTRY_GC_MAX_DURATION_SECONDS:-900}"
      BUILD_OUTBOX_INTERVAL_SECONDS: "${BUILD_OUTBOX_INTERVAL_SECONDS:-1}"
      BUILD_OUTBOX_BATCH_SIZE: "${BUILD_OUTBOX_BATCH_SIZE:-10}"
      CONTAINER_CREATE_WORKER_COUNT: "${CONTAINER_CREATE_WORKER_COUNT:-2}"
      CONTAINER_CREATE_MAX_ATTEMPTS: "${CONTAINER_CREATE_MAX_ATTEMPTS:-3}"
      CONTAINER_CREATE_TIMEOUT_MINUTES: "${CONTAINER_CREATE_TIMEOUT_MINUTES:-30}"
      MAX_QUEUED_CONTAINER_CREATES_PER_USER: "${MAX_QUEUED_CONTAINER_CREATES_PER_USER:-5}"
      CONTAINER_CREATE_OUTBOX_INTERVAL_SECONDS: "${CONTAINER_CREATE_OUTBOX_INTERVAL_SECONDS:-1}"
      CONTAINER_CREATE_OUTBOX_BATCH_SIZE: "${CONTAINER_CREATE_OUTBOX_BATCH_SIZE:-10}"
      REPORTS_USAGE_SNAPSHOT_INTERVAL_SECONDS: "${REPORTS_USAGE_SNAPSHOT_INTERVAL_SECONDS:-300}"
      MAX_STAGED_SOURCE_BYTES_PER_USER: "${MAX_STAGED_SOURCE_BYTES_PER_USER:-1073741824}"
      MAX_QUEUED_BUILDS_PER_USER: "${MAX_QUEUED_BUILDS_PER_USER:-10}"
      COMPOSE_UPLOAD_MAX_BYTES: "${COMPOSE_UPLOAD_MAX_BYTES:-104857600}"
      COMPOSE_PIPELINE_TIMEOUT_MINUTES: "${COMPOSE_PIPELINE_TIMEOUT_MINUTES:-30}"
      COMPOSE_DEPLOY_WORKER_COUNT: "${COMPOSE_DEPLOY_WORKER_COUNT:-2}"
      COMPOSE_OUTBOX_INTERVAL_SECONDS: "${COMPOSE_OUTBOX_INTERVAL_SECONDS:-1}"
      COMPOSE_OUTBOX_BATCH_SIZE: "${COMPOSE_OUTBOX_BATCH_SIZE:-10}"
      COMPOSE_DEPLOY_MAX_ATTEMPTS: "${COMPOSE_DEPLOY_MAX_ATTEMPTS:-3}"
      MAX_QUEUED_COMPOSE_DEPLOYS_PER_USER: "${MAX_QUEUED_COMPOSE_DEPLOYS_PER_USER:-5}"
      COMPOSE_DEPENDENCY_WAIT_TIMEOUT_MINUTES: "${COMPOSE_DEPENDENCY_WAIT_TIMEOUT_MINUTES:-5}"
      COMPOSE_COORDINATOR_INTERVAL_SECONDS: "${COMPOSE_COORDINATOR_INTERVAL_SECONDS:-2}"
      HOST_MIN_FREE_DISK_BYTES: "${HOST_MIN_FREE_DISK_BYTES:-1073741824}"
      MEMORY_PRESSURE_MIN_FREE_BYTES: "${MEMORY_PRESSURE_MIN_FREE_BYTES:-536870912}"
      MEMORY_PRESSURE_INTERVAL_SECONDS: "${MEMORY_PRESSURE_INTERVAL_SECONDS:-10}"
      MEMORY_BOOST_MULTIPLIER: "${MEMORY_BOOST_MULTIPLIER:-8}"
      CPU_BOOST_MULTIPLIER: "${CPU_BOOST_MULTIPLIER:-8}"
      BOOST_MIN_FREE_MEMORY_BYTES: "${BOOST_MIN_FREE_MEMORY_BYTES:-2147483648}"
      DEFAULT_VOLUME_SIZE_BYTES: "${DEFAULT_VOLUME_SIZE_BYTES:-268435456}"
      VOLUME_SIZE_ENFORCEMENT: "${VOLUME_SIZE_ENFORCEMENT:-false}"
      DEFAULT_USER_QUOTA_CPU: "${DEFAULT_USER_QUOTA_CPU:-2.0}"
      DEFAULT_USER_QUOTA_RAM_MB: "${DEFAULT_USER_QUOTA_RAM_MB:-2048}"
      DEFAULT_USER_QUOTA_DISK_MB: "${DEFAULT_USER_QUOTA_DISK_MB:-5120}"
      GIT_SOURCES_ENABLED: "${GIT_SOURCES_ENABLED:-true}"
      GIT_ALLOWED_HOSTS: "${GIT_ALLOWED_HOSTS:-github.com,gitlab.com,bitbucket.org}"
      GIT_CLONE_TIMEOUT_SECONDS: "${GIT_CLONE_TIMEOUT_SECONDS:-60}"
      GIT_MAX_REPOSITORY_BYTES: "${GIT_MAX_REPOSITORY_BYTES:-209715200}"
      TELEMETRY_MAX_LOG_TAIL_LINES: "${TELEMETRY_MAX_LOG_TAIL_LINES:-1000}"
      TELEMETRY_MAX_LOG_STREAMS_PER_USER: "${TELEMETRY_MAX_LOG_STREAMS_PER_USER:-5}"
      TELEMETRY_MAX_TERMINAL_SESSIONS_PER_USER: "${TELEMETRY_MAX_TERMINAL_SESSIONS_PER_USER:-2}"
      TELEMETRY_TERMINAL_IDLE_TIMEOUT_SECONDS: "${TELEMETRY_TERMINAL_IDLE_TIMEOUT_SECONDS:-300}"
      TELEMETRY_TERMINAL_MAX_DURATION_SECONDS: "${TELEMETRY_TERMINAL_MAX_DURATION_SECONDS:-3600}"
      TELEMETRY_ALLOWED_EXEC_COMMANDS: "${TELEMETRY_ALLOWED_EXEC_COMMANDS:-/bin/sh,/bin/bash,/busybox/sh}"
      TELEMETRY_MAX_COMMAND_ARGS: "${TELEMETRY_MAX_COMMAND_ARGS:-8}"
      TELEMETRY_MAX_COMMAND_ARG_BYTES: "${TELEMETRY_MAX_COMMAND_ARG_BYTES:-128}"
      TELEMETRY_WS_READ_LIMIT_BYTES: "${TELEMETRY_WS_READ_LIMIT_BYTES:-4096}"
      TELEMETRY_MAX_GLOBAL_LOG_STREAMS: "${TELEMETRY_MAX_GLOBAL_LOG_STREAMS:-100}"
      TELEMETRY_MAX_GLOBAL_TERMINAL_SESSIONS: "${TELEMETRY_MAX_GLOBAL_TERMINAL_SESSIONS:-50}"
      TELEMETRY_READ_HEADER_TIMEOUT_SECONDS: "${TELEMETRY_READ_HEADER_TIMEOUT_SECONDS:-5}"
      TELEMETRY_IDLE_TIMEOUT_SECONDS: "${TELEMETRY_IDLE_TIMEOUT_SECONDS:-120}"
      TELEMETRY_SHUTDOWN_TIMEOUT_SECONDS: "${TELEMETRY_SHUTDOWN_TIMEOUT_SECONDS:-15}"
      TELEMETRY_MAX_HEADER_BYTES: "${TELEMETRY_MAX_HEADER_BYTES:-1048576}"
      CORE_GRPC_PORT: "50052"
      CORE_HTTP_PORT: "8083"
      CORE_HOST_DISK_PATH: "${CORE_HOST_DISK_PATH:-/host}"
      DOCKER_DATA_ROOT: "${DOCKER_DATA_ROOT:-/var/lib/docker}"
      TENANT_CGROUP_PARENT: "${TENANT_CGROUP_PARENT:-}"
    volumes:
      - ${REGISTRY_CERTS_DIR:?REGISTRY_CERTS_DIR is required}/ca.crt:/run/dcm-registry/ca.crt:ro
      - ${REGISTRY_CERTS_DIR:?REGISTRY_CERTS_DIR is required}/registry.crt:/run/dcm-registry/registry.crt:ro
      - ${REGISTRY_CERTS_DIR:?REGISTRY_CERTS_DIR is required}/registry.key:/run/dcm-registry/registry.key:ro
      - ${REGISTRY_CERTS_DIR:?REGISTRY_CERTS_DIR is required}/signing.crt:/run/dcm-registry/signing.crt:ro
      - ${REGISTRY_CERTS_DIR:?REGISTRY_CERTS_DIR is required}/signing.key:/run/dcm-registry/signing.key:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Only Docker's data directory of the host, at the same path under the
      # host prefix: host disk figures and volume usage scans read it there.
      - ${DOCKER_DATA_ROOT:-/var/lib/docker}:${CORE_HOST_DISK_PATH:-/host}${DOCKER_DATA_ROOT:-/var/lib/docker}:ro
      - core_config_data:/app/config
    networks:
      dcm_net:
        aliases: [registry-edge]
      registry_net: {}
      registry_front_net:
        aliases: [core-registry]
    depends_on:
      migrate_core:
        condition: service_completed_successfully
      migrate_reports:
        condition: service_completed_successfully
      sso:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      # Core attaches exposed containers to proxy_net, which the policy isolates.
      build-network-policy:
        condition: service_healthy

  builder:
    <<: *service-defaults
    build:
      <<: *backend-build
      dockerfile: dockerfiles/builder.Dockerfile
    environment:
      <<: [*rabbitmq-url-env, *object-storage-env, *build-runtime-env]
      CORE_GRPC_TARGET: "core:50052"
      BUILDER_INSTANCE_ID: "${BUILDER_INSTANCE_ID:-builder-1}"
      TENANT_CGROUP_PARENT: "${TENANT_CGROUP_PARENT:-}"
      REGISTRY_URL: "${REGISTRY_URL:-registry:5000}"
      BUILDER_SERVICE_TOKEN: "${BUILDER_SERVICE_TOKEN:?BUILDER_SERVICE_TOKEN is required}"
      REGISTRY_CA_FILE: /run/dcm-registry/ca.crt
      BUILD_STORAGE_PATH: "/tmp/builds"
      BUILD_LOGS_PATH: "/tmp/build_logs"
    volumes:
      - ${REGISTRY_CERTS_DIR:?REGISTRY_CERTS_DIR is required}/ca.crt:/run/dcm-registry/ca.crt:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - builder_storage:/tmp/builds
      - builder_logs:/tmp/build_logs
    networks:
      - dcm_net
    depends_on:
      build-network-policy:
        condition: service_healthy
      build-egress:
        condition: service_started
      core:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  gateway:
    <<: *service-defaults
    build:
      <<: *backend-build
      dockerfile: dockerfiles/gateway.Dockerfile
    environment:
      GATEWAY_PORT: "8081"
      SSO_GRPC_TARGET: "sso:50051"
      CORE_GRPC_TARGET: "core:50052"
      CORE_HTTP_TARGET: "http://core:8083"
      GATEWAY_SERVICE_TOKEN: "${GATEWAY_SERVICE_TOKEN:?GATEWAY_SERVICE_TOKEN is required}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:5173}"
      GATEWAY_TRUSTED_PROXIES: "${TRAEFIK_GATEWAY_IP:-172.30.251.2}"
      GATEWAY_MAX_JSON_BODY_BYTES: "${GATEWAY_MAX_JSON_BODY_BYTES:-1048576}"
      GATEWAY_AUTH_RATE_LIMIT_REQUESTS: "${GATEWAY_AUTH_RATE_LIMIT_REQUESTS:-20}"
      GATEWAY_AUTH_RATE_LIMIT_WINDOW_SECONDS: "${GATEWAY_AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}"
      GATEWAY_AUTH_REDIRECT_ALLOWED_ORIGINS: "${GATEWAY_AUTH_REDIRECT_ALLOWED_ORIGINS:-}"
      GATEWAY_AUTH_CALLBACK_PATH: "${GATEWAY_AUTH_CALLBACK_PATH:-/auth/callback}"
      GATEWAY_UPLOAD_RATE_LIMIT_REQUESTS: "${GATEWAY_UPLOAD_RATE_LIMIT_REQUESTS:-10}"
      GATEWAY_UPLOAD_RATE_LIMIT_WINDOW_SECONDS: "${GATEWAY_UPLOAD_RATE_LIMIT_WINDOW_SECONDS:-60}"
      GATEWAY_READ_HEADER_TIMEOUT_SECONDS: "${GATEWAY_READ_HEADER_TIMEOUT_SECONDS:-5}"
      GATEWAY_READ_TIMEOUT_SECONDS: "${GATEWAY_READ_TIMEOUT_SECONDS:-360}"
      GATEWAY_WRITE_TIMEOUT_SECONDS: "${GATEWAY_WRITE_TIMEOUT_SECONDS:-360}"
      GATEWAY_IDLE_TIMEOUT_SECONDS: "${GATEWAY_IDLE_TIMEOUT_SECONDS:-120}"
      GATEWAY_SHUTDOWN_TIMEOUT_SECONDS: "${GATEWAY_SHUTDOWN_TIMEOUT_SECONDS:-15}"
      GATEWAY_MAX_HEADER_BYTES: "${GATEWAY_MAX_HEADER_BYTES:-1048576}"
      GATEWAY_PROXY_DIAL_TIMEOUT_SECONDS: "${GATEWAY_PROXY_DIAL_TIMEOUT_SECONDS:-10}"
      GATEWAY_PROXY_TLS_HANDSHAKE_TIMEOUT_SECONDS: "${GATEWAY_PROXY_TLS_HANDSHAKE_TIMEOUT_SECONDS:-10}"
      GATEWAY_PROXY_RESPONSE_HEADER_TIMEOUT_SECONDS: "${GATEWAY_PROXY_RESPONSE_HEADER_TIMEOUT_SECONDS:-60}"
      GATEWAY_PROXY_IDLE_CONN_TIMEOUT_SECONDS: "${GATEWAY_PROXY_IDLE_CONN_TIMEOUT_SECONDS:-90}"
      GATEWAY_PROXY_EXPECT_CONTINUE_TIMEOUT_SECONDS: "${GATEWAY_PROXY_EXPECT_CONTINUE_TIMEOUT_SECONDS:-1}"
      GATEWAY_PROXY_MAX_IDLE_CONNS: "${GATEWAY_PROXY_MAX_IDLE_CONNS:-100}"
      GATEWAY_PROXY_MAX_IDLE_CONNS_PER_HOST: "${GATEWAY_PROXY_MAX_IDLE_CONNS_PER_HOST:-20}"
      GATEWAY_GRPC_REQUEST_TIMEOUT_SECONDS: "${GATEWAY_GRPC_REQUEST_TIMEOUT_SECONDS:-300}"
      GATEWAY_GRPC_MIN_CONNECT_TIMEOUT_SECONDS: "${GATEWAY_GRPC_MIN_CONNECT_TIMEOUT_SECONDS:-5}"
      GATEWAY_READINESS_TIMEOUT_SECONDS: "${GATEWAY_READINESS_TIMEOUT_SECONDS:-3}"
      GATEWAY_TELEMETRY_TICKET_TTL_SECONDS: "${GATEWAY_TELEMETRY_TICKET_TTL_SECONDS:-60}"
      COOKIE_NAME: "${COOKIE_NAME:-refresh_token}"
      COOKIE_PATH: "${COOKIE_PATH:-/}"
      COOKIE_DOMAIN: "${COOKIE_DOMAIN:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      COOKIE_HTTP_ONLY: "${COOKIE_HTTP_ONLY:-true}"
      COOKIE_SAMESITE: "${COOKIE_SAMESITE:-lax}"
    labels:
      <<: [*traefik-common-labels, *traefik-security-headers]
      traefik.docker.network: "dcm_gateway_ingress"
      traefik.http.routers.gateway-api.rule: "Host(`${DCM_HOST:-localhost}`) && PathPrefix(`/api/v1`)"
      traefik.http.routers.gateway-api.priority: "10"
      traefik.http.routers.gateway-api.service: "gateway"
      traefik.http.routers.gateway-api.middlewares: "dcm-security-headers,dcm-api-ratelimit,dcm-json-buffer"
      traefik.http.routers.gateway-upload.rule: "Host(`${DCM_HOST:-localhost}`) && (Path(`/api/v1/images/build`) || Path(`/api/v1/images/build/git`) || Path(`/api/v1/projects/compose`) || Path(`/api/v1/projects/compose/git`))"
      traefik.http.routers.gateway-upload.priority: "30"
      traefik.http.routers.gateway-upload.service: "gateway"
      traefik.http.routers.gateway-upload.middlewares: "dcm-security-headers,dcm-api-ratelimit"
      traefik.http.routers.gateway-stream.rule: "Host(`${DCM_HOST:-localhost}`) && PathRegexp(`^/api/v1/(admin/)?containers/[^/]+/(logs/stream|terminal)$`)"
      traefik.http.routers.gateway-stream.priority: "40"
      traefik.http.routers.gateway-stream.service: "gateway"
      traefik.http.routers.gateway-stream.middlewares: "dcm-security-headers"
      traefik.http.routers.gateway-health.rule: "Host(`${DCM_HOST:-localhost}`) && PathPrefix(`/health`)"
      traefik.http.routers.gateway-health.priority: "10"
      traefik.http.routers.gateway-health.service: "gateway"
      traefik.http.routers.gateway-health.middlewares: "dcm-security-headers"
      traefik.http.services.gateway.loadbalancer.server.port: "8081"
      traefik.http.middlewares.dcm-api-ratelimit.ratelimit.average: "120"
      traefik.http.middlewares.dcm-api-ratelimit.ratelimit.period: "1m"
      traefik.http.middlewares.dcm-api-ratelimit.ratelimit.burst: "60"
      traefik.http.middlewares.dcm-json-buffer.buffering.maxrequestbodybytes: "1048576"
      traefik.http.middlewares.dcm-json-buffer.buffering.memrequestbodybytes: "1048576"
    networks:
      - gateway_ingress
      - dcm_net
    depends_on:
      - sso
      - core

  frontend:
    <<: *service-defaults
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${FRONTEND_API_URL:-http://localhost/api/v1}"
        VITE_BASE_DOMAIN: "${BASE_DOMAIN:-localhost}"
    labels:
      <<: [*traefik-common-labels, *traefik-security-headers]
      traefik.http.routers.frontend.rule: "Host(`${DCM_HOST:-localhost}`) && PathPrefix(`/`)"
      traefik.http.routers.frontend.priority: "1"
      traefik.http.routers.frontend.service: "frontend"
      traefik.http.routers.frontend.middlewares: "dcm-security-headers,dcm-frontend-compress"
      traefik.http.services.frontend.loadbalancer.server.port: "8080"
      traefik.http.middlewares.dcm-frontend-compress.compress: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proxy_net

networks:
  gateway_ingress:
    name: dcm_gateway_ingress
    internal: true
    ipam:
      config:
        - subnet: "${GATEWAY_INGRESS_SUBNET:-172.30.251.0/24}"
  proxy_net:
    name: proxy_net
    driver_opts:
      com.docker.network.bridge.name: "${PROXY_BRIDGE_NAME:-br-dcm-proxy}"
    ipam:
      config:
        # Docker allocates exposed containers only from ip_range, so Traefik's
        # fixed address outside it is never taken first.
        - subnet: "${PROXY_NETWORK_SUBNET:-172.30.240.0/21}"
          ip_range: "${PROXY_NETWORK_IP_RANGE:-172.30.244.0/22}"
  dcm_net:
    name: dcm_net
  registry_publish_net: {}
  registry_front_net:
    internal: true
  registry_net:
    internal: true
  build_egress_net:
    driver_opts:
      com.docker.network.bridge.name: br-dcm-egress
  build_net:
    name: build_net
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: br-dcm-build
    ipam:
      config:
        - subnet: 172.30.252.0/24

volumes:
  core_db_data:
  sso_db_data:
  core_config_data:
  builder_storage:
  builder_logs:
  rabbitmq_data:
  minio_data:
  clickhouse_data:
  registry_data:
